<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Guest inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same look as the admin (checkin-admin.html): Inter, the same colours and button sizes. No blue, no emojis. */
:root{
  --bg:#FAFAF9;--surface:#fff;--ink:#2C2C2A;--ink-2:#4A4A48;--muted:#6B6B68;
  --line:#E8E4E0;--green:#2d6b50;--green-bg:#edf5f0;--red:#8b2020;--red-bg:#fdf0f0;
  --amber:#6B5A2E;--amber-bg:#faf6ee;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --r:10px;--rs:6px;
  --bubble:#EFEDEA;
  /* names the page already used, mapped to the admin's colours */
  --card-bg:var(--surface);--text-main:var(--ink);--text-muted:var(--muted);--border:var(--line);
  --status-green:var(--green);--bg-green:var(--green-bg);--status-amber:var(--amber);--bg-amber:var(--amber-bg);
  --status-red:var(--red);--bg-red:var(--red-bg);--radius-card:12px;
  --chat-pad:max(16px,calc((100% - 760px) / 2));      /* chat column: at most 760 px wide on a laptop */
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.4;font-size:15px;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;overflow:hidden}
button,select,input,textarea{font-family:inherit;letter-spacing:inherit}
button{font:inherit;cursor:pointer;color:var(--ink);-webkit-appearance:none;appearance:none;touch-action:manipulation}   /* iPhone Safari paints buttons blue unless they set a colour */
a{color:var(--ink)}
svg{display:block;flex:none}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- layout: one pane on a phone, list and chat side by side on a wide screen ---------- */
#app{display:none;height:100vh;height:100dvh}
#listPane,#chatPane{display:flex;flex-direction:column;min-height:0;min-width:0;height:100%}
#listPane{width:100%}
#chatPane{display:none;flex:1;position:relative}
body.show-chat #listPane{display:none}
body.show-chat #chatPane{display:flex}
@media (min-width:860px){
  #listPane{width:390px;flex:none;border-right:1px solid var(--line)}
  #chatPane,body.show-chat #chatPane{display:flex}
  body.show-chat #listPane{display:flex}
  .only-narrow{display:none!important}
}
.pane__top{flex:none;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.pane__scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pane__foot{flex:none;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;padding:4px 16px calc(4px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--muted)}
.top__row{display:flex;align-items:center;gap:8px;min-height:44px}
.top__title{font-size:18px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:0;background:transparent;
  color:var(--ink);border-radius:var(--r);margin-left:-10px;gap:2px;font-size:14px;font-weight:600}
.tabs{display:flex;gap:6px;margin-top:4px}
.tab{flex:1;min-height:44px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);
  font-size:14px;font-weight:600;padding:0 8px}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab small{font-weight:600;opacity:.7;margin-left:3px;font-size:12px}
.sub{display:flex;justify-content:flex-end;margin-top:2px}
.linkbtn{display:inline-flex;align-items:center;border:0;background:transparent;color:var(--ink);font-size:13px;font-weight:600;text-decoration:underline;min-height:44px;padding:0 6px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font-size:14px;font-weight:600}
.chip--on{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.chip--off{color:var(--muted)}
.filters{display:flex;gap:6px;margin-top:6px}
.filters input,.filters select{min-height:44px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);font-size:16px;padding:0 12px;min-width:0}
.filters input{flex:1}
.filters select{flex:0 0 auto;max-width:44%}

/* ---------- list ---------- */
.list{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-card);padding:12px 14px;color:var(--ink)}
.row:active{background:#f3f1ee}
.row.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.row__top{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink);flex:none}
.row__name{font-weight:600;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .row__name{font-weight:700}
.row.unread .row__prev{font-weight:600}
.row__time{font-size:12px;color:var(--muted);flex:none}
.row__meta{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row__room{font-weight:700;color:var(--ink-2)}
.row__listing{font-size:12px}
.row__prev{font-size:14px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bubble);color:var(--ink)}
.tag--red{background:var(--red-bg);color:var(--red)}
.tag--green{background:var(--green-bg);color:var(--green)}
.tag--amber{background:var(--amber-bg);color:var(--amber)}
.tag--grey{background:#ececea;color:var(--muted)}
.tag--ink{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.row__wait{font-size:12px;color:var(--muted)}

/* ---------- chat ---------- */
.head{flex:none;position:relative;padding:calc(6px + env(safe-area-inset-top)) var(--chat-pad) 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.head__row{display:flex;align-items:center;gap:6px;min-height:44px}
.head__name{font-size:18px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head__line{font-size:13px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head__more{display:none;margin-left:0;margin-right:-10px}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn--primary{background:var(--ink);border-color:var(--ink);color:#ffffff}
.btn:disabled{opacity:.45}
/* on a phone with the keyboard open the header shrinks to one line; the buttons move into the "..." menu */
#chatPane.typing .head__line,#chatPane.typing .head .card{display:none}
#chatPane.typing .head__more{display:inline-flex}
#chatPane.typing .actions{display:none}
#chatPane.typing.menu-open .actions{display:flex;flex-direction:column;position:absolute;left:16px;right:16px;top:100%;z-index:6;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);margin-top:0}
.thread{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px var(--chat-pad);display:flex;flex-direction:column;gap:8px}
.day{align-self:center;font-size:12px;color:var(--muted);margin:8px 0 0;background:#ececea;border-radius:999px;padding:2px 10px}
.bubble{max-width:86%;align-self:flex-start;background:var(--bubble);border-radius:16px 16px 16px 4px;padding:9px 12px;
  white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.bubble__time{font-size:12px;color:var(--muted);margin-top:4px}
.me{align-self:flex-end;max-width:86%;display:flex;flex-direction:column;align-items:flex-end}
.bubble--me{align-self:flex-end;background:var(--ink);color:#ffffff;border-radius:16px 16px 4px 16px;padding:9px 12px;
  white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;max-width:100%}
/* the AI assistant's replies: outlined, with a label, so they never look like ours */
.ai-label{font-size:12px;font-weight:700;color:var(--ink-2);margin:0 4px 2px}
.bubble--ai{align-self:flex-end;background:var(--surface);color:var(--ink);border:1.5px solid var(--ink-2);border-radius:16px 16px 4px 16px;padding:8px 12px;
  white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;max-width:100%}
.me__status{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.me__status--bad{color:var(--red);font-weight:600}
.me__status--wait{color:var(--amber);font-weight:600}
.me__status--ok{color:var(--green);font-weight:600}
.mini{min-height:44px;padding:0 14px;border-radius:var(--r);border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px}
.mini--link{display:inline-flex;align-items:center;text-decoration:none}
.note{align-self:center;text-align:center;font-size:12px;color:var(--muted);padding:2px 8px}
.msg{color:var(--muted);padding:14px 16px;font-size:14px}
.err{margin:16px;padding:12px;border-radius:var(--r);background:var(--red-bg);color:var(--red);font-size:14px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:12px 14px}
.rv__reason{font-weight:700}
.rv__meta{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.rv__btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:24px;text-align:center}
.card{margin-top:8px;border-radius:var(--r);padding:10px 12px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.card--amber{background:var(--amber-bg);border-color:#e3d6b0;color:var(--amber)}
.card--red{background:var(--red-bg);border-color:#ebc9c9;color:var(--red)}
.card--grey{background:#f3f2ef;color:var(--muted)}
.card__title{font-weight:700}
.card__sub{margin-top:2px}
.btn--full{width:100%;min-height:48px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:var(--ink);color:#ffffff;border-radius:12px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast button{min-height:44px;padding:0 14px;border:0;background:transparent;color:#ffffff;font-weight:700;text-decoration:underline;font-size:14px}

/* ---------- AI draft, notes ---------- */
.draft{flex:none;margin:0 var(--chat-pad) 8px;border:1.5px solid var(--ink-2);background:var(--surface);border-radius:12px;padding:10px 12px}
.reqbtn{display:inline-flex;align-items:center;min-height:44px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline;padding:0 4px}
.reqdone{display:inline-block;font-size:12px;font-weight:600;color:var(--green);padding:4px 4px 0}
#bpanel{position:absolute;top:0;right:0;bottom:0;width:100%;max-width:380px;background:var(--bg);border-left:1px solid var(--line);z-index:8;display:flex;flex-direction:column}
@media (max-width:859px){#bpanel{max-width:none;border-left:0}}
#bpanel[hidden]{display:none}
.bp__row{padding:10px 16px;border-bottom:1px solid var(--line)}
.bp__k{font-size:12px;color:var(--muted)}
.bp__v{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.aiwait{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 var(--chat-pad);padding:8px 12px;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);font-size:14px}
.aiwait:empty{display:none}
.aiwait__t{flex:1;min-width:140px;font-weight:600}
.aiwhy{font-size:12px;color:var(--muted);margin-top:2px;text-align:right}
.aiwhy--warn{color:var(--red);font-weight:600}
.aiwhy__btns{display:flex;gap:6px;justify-content:flex-end;margin-top:2px}
.aiwhy__btns button{min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);font-size:13px;font-weight:600}
.sect{font-size:14px;font-weight:700;padding:14px 16px 6px}
.sect small{color:var(--muted);font-weight:600;margin-left:6px}
.stack{display:flex;flex-direction:column;gap:8px;padding:0 16px}
.rv__text{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px}
.testbox{display:flex;flex-direction:column;gap:8px;padding:0 16px 24px}
.testbox textarea,.testbox input{font-size:16px;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);color:var(--ink);min-height:44px;width:100%}
.draft__title{font-size:14px;font-weight:700}
.draft__why{font-size:12px;color:var(--muted);margin-top:2px}
.draft__text{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px;max-height:28vh;overflow-y:auto;font-size:15px}
.draft__btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.draft--needs{background:var(--amber-bg);border-color:#e3d6b0}
.draft--needs .draft__title{color:var(--amber)}
.draft--info{background:#f3f2ef;border-color:var(--line)}

/* ---------- embedded in the admin: the admin owns the title row, the Admin link and alerts ---------- */
html.embed .top__row--title,html.embed #alertsBtn,html.embed .pane__foot{display:none}
html.embed .pane__top{padding-top:8px}
html.embed body{background:var(--bg)}

/* ---------- composer ---------- */
.reply{flex:none;background:var(--bg);border-top:1px solid var(--line);padding:8px var(--chat-pad) calc(8px + env(safe-area-inset-bottom))}
.reply__row{display:flex;gap:8px;align-items:flex-end}
.reply textarea{flex:1;min-width:0;font:inherit;font-size:16px;line-height:1.35;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;resize:none;max-height:40vh;min-height:48px;-webkit-appearance:none;appearance:none}
.reply .btn{min-height:48px;padding:0 20px}
.reply__err{color:var(--red);font-size:13px;margin:0 0 6px}
.reply__count{font-size:12px;color:var(--muted);text-align:right;margin-top:2px}
.reply__hint{font-size:12px;color:var(--muted);margin-top:2px}
.wbox{background:var(--amber-bg);color:var(--amber);border:1px solid #e3d6b0;border-radius:var(--r);padding:8px 10px;font-size:13px;margin-bottom:8px}
.wbox ul{margin:4px 0 8px 18px}
.wbox__btns{display:flex;gap:8px;flex-wrap:wrap}
.wbox__quote{margin:4px 0 8px;color:var(--ink)}
.who{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.who--live{color:var(--green);border-color:#bfd9c8;background:var(--green-bg)}
.presence{font-size:13px;color:var(--green);font-weight:600;padding:2px 16px 0;min-height:0}
.presence:empty{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="listPane">
    <div class="pane__top" id="listTop"></div>
    <div class="pane__scroll" id="listBody"></div>
    <div class="pane__foot" id="listFoot"></div>
  </div>
  <div id="chatPane"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";
import { requireInboxUser, inboxUserFor } from "./shared/inbox-auth.js";
import { replyWarnings } from "./shared/inbox-reply-warnings.js";

/* ---------- inside the admin (embed) ---------- */
const QS = new URLSearchParams(location.search);
const EMBED = QS.get("embed") === "1" && window.parent !== window;
const SIGNIN_RETURN = QS.get("signin") === "1";                 // opened full page just to sign in, then back to the admin tab
let inboxMode = "page";
try { inboxMode = localStorage.getItem("maxela_inbox_open") === "tab" ? "tab" : "page"; } catch (e) { /* page */ }
if (!EMBED && !SIGNIN_RETURN && QS.get("standalone") !== "1" && inboxMode === "tab") {
  // The admin setting says "inside the admin": alert taps and bookmarks to /inbox go to the admin's Inbox tab.
  const m = location.hash.match(/^#c\/(.+)$/);
  location.replace("/checkin-admin?tab=inbox" + (m ? "&c=" + m[1] : location.hash === "#ai" ? "&view=ai" : ""));
}
if (EMBED) document.documentElement.classList.add("embed");
const tellAdmin = msg => { if (EMBED) { try { window.parent.postMessage(Object.assign({ source: "maxela-inbox" }, msg), location.origin); } catch (e) { /* ignore */ } } };
/* Switched OFF until the console steps in the report are done (see docs/INBOX_PLAN.md): the sign-in pop-up then runs on our own domain. */
const USE_OWN_AUTH_DOMAIN = false;

const firebaseConfig = {
  apiKey: "AIzaSyCbggwwtdw751yQUO6MaHCuYKyNn7AyOTk",
  authDomain: USE_OWN_AUTH_DOMAIN ? "app.maxelaapartments.com" : "sleepy-5c962.firebaseapp.com",
  projectId: "sleepy-5c962",
  storageBucket: "sleepy-5c962.firebasestorage.app",
  messagingSenderId: "152940098906",
  appId: "1:152940098906:web:bf245230d705c0a62c2f63"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const fns = getFunctions(app, "europe-west1");
const sendReplyFn = httpsCallable(fns, "inboxSendReply");
const checkinLinkFn = httpsCallable(fns, "inboxCheckinLink");
const discardDraftFn = httpsCallable(fns, "inboxDraftDiscard");
const alertsFn = httpsCallable(fns, "inboxAlerts");
const reviewHandledFn = httpsCallable(fns, "inboxReviewHandled");
const aiActionFn = httpsCallable(fns, "inboxAiAction");
const aiKnowledgeFn = httpsCallable(fns, "inboxAiKnowledge");
const bookingPanelFn = httpsCallable(fns, "inboxBookingPanel");
const requestCreateFn = httpsCallable(fns, "inboxRequestCreate");

const TZ = "Asia/Tbilisi";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICON = {
  back: '<path d="m15 18-6-6 6-6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  out: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  warn: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
};
const icon = n => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
// A phone keyboard has no Shift+Enter, so on touch screens Enter is a new line and Send is the button.
const IS_TOUCH = (() => { try { return window.matchMedia("(pointer: coarse)").matches; } catch { return false; } })();

/* ---------- state ---------- */
let convs = [];
let reviewItems = [];
let tab = "needs";          // needs | all | done
let loaded = { convs: false, review: false };
let loadError = "";
let reviewError = "";
let lastRenderedTab = "";
let searchQ = "";           // the search box
const NO_LISTING = "\u0000none";
let listingFilter = "";     // the listing filter ("" = all)
let aiMode = null;          // off | drafts | auto, from globals/config (null until read)
let cameFromList = false;   // the chat was opened from the list in this visit (so Back can use the browser history)
let topBuilt = false;
let msgUnsub = null;
let msgs = [];
let msgsFor = null;
const pending = {};         // bookingNumber -> [{id, text, sentAt}] replies shown before the server has saved them
let me = null;              // the signed-in inbox user ({email, name}), for the "sent by" name on my pending bubbles
const sendingNow = {};      // bookingNumber -> true while a send is in flight (blocks a double send)

/* ---------- time helpers ---------- */
const toDate = v => (v ? (v.toDate ? v.toDate() : new Date(v)) : null);
const fmt = (d, o) => new Intl.DateTimeFormat("en-GB", { timeZone: TZ, ...o }).format(d);
const dayKey = d => fmt(d, { year: "numeric", month: "2-digit", day: "2-digit" });
function fmtListTime(d) {
  if (!d) return "";
  if (dayKey(d) === dayKey(new Date())) return fmt(d, { hour: "2-digit", minute: "2-digit" });
  return fmt(d, { day: "numeric", month: "short" });
}
const fmtClock = d => fmt(d, { hour: "2-digit", minute: "2-digit" });
const fmtDay = d => fmt(d, { weekday: "short", day: "numeric", month: "short" });
function dayLabel(d) {
  const now = new Date();
  if (dayKey(d) === dayKey(now)) return "Today";
  if (dayKey(d) === dayKey(new Date(now.getTime() - 86400000))) return "Yesterday";
  const sameYear = fmt(d, { year: "numeric" }) === fmt(now, { year: "numeric" });
  return fmt(d, sameYear ? { day: "numeric", month: "short" } : { day: "numeric", month: "short", year: "numeric" });
}
function fmtDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  if (!y) return iso;
  return new Intl.DateTimeFormat("en-GB", { timeZone: "UTC", day: "numeric", month: "short" }).format(new Date(Date.UTC(y, m - 1, d)));
}
const stayText = c => (c.checkin && c.checkout ? `${fmtDate(c.checkin)} to ${fmtDate(c.checkout)}` : "");

/* ---------- model helpers ---------- */
const tsMs = v => toDate(v)?.getTime() || 0;
const activityTime = c => Math.max(tsMs(c.lastMessageAt), tsMs(c.cancelRequest?.at), tsMs(c.checkinRequest?.at));
const hasChat = c => (c.messageCount || 0) > 0;
const visible = c => hasChat(c) || !!c.cancelRequest || !!c.checkinRequest;
const isCancelled = c => String(c.reservationStatus || "").toUpperCase() === "CANCELLED";
// A cancellation request for a booking that is already cancelled needs nothing from us.
const needsReply = c => !c.done && (!!c.needsReply || (!!c.cancelRequest && !isCancelled(c)));
const statusLabel = c => (isCancelled(c) ? "Cancelled" : String(c.reservationStatus || "").toUpperCase() === "OK2" ? "Confirmed" : "");
const propLine = c => [c.propertyName, c.roomCode].filter(Boolean).join(" \u00b7 ");
// Since when the guest has been waiting (the first unanswered guest message); drafts and notes never change it.
const waitSince = c => tsMs(c.waitingSince) || tsMs(c.lastGuestMessageAt) || tsMs(c.cancelRequest?.at) || tsMs(c.checkinRequest?.at) || 0;
function fmtWait(ms) {
  const m = Math.floor(ms / 60000);
  if (m < 1) return "less than 1 min";
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60);
  return h < 48 ? `${h} h` : `${Math.floor(h / 24)} d`;
}
const closedAsThanks = c => !!c.done && tsMs(c.closedAsThanksAt) > 0 && tsMs(c.closedAsThanksAt) >= tsMs(c.lastGuestMessageAt);
const whenText = dl => (dayKey(dl) === dayKey(new Date()) ? fmtClock(dl) : `${fmtDay(dl)}, ${fmtClock(dl)}`);
const guestAddr = c => /@guest\.booking\.com$/i.test(c.replyTo || "");
const fmtRange = t => String(t || "").replace(/\s*[-\u2013]\s*/, " to ");

/** The one thing to do about a conversation, as one short tag: { t: text, k: colour }, or null. */
function actionTag(c) {
  const open = !c.done;
  if (open && c.lastSendStatus === "failed") return { t: "Not sent: try again", k: "red" };
  if (open && c.lastSendStatus === "unknown") return { t: "Not sure it arrived: check in Booking.com", k: "amber" };
  if (open && c.cancelRequest) {
    if (isCancelled(c)) return { t: "Booking was cancelled", k: "grey" };
    const dl = toDate(c.cancelRequest.deadline);
    return { t: dl ? `Cancellation: answer in Booking.com by ${whenText(dl)}` : "Cancellation: answer in Booking.com", k: "red" };
  }
  if (open && c.checkinRequest && !c.checkinRequest.autoConfirmed && c.checkinAction) {
    const verb = c.checkinAction.verb === "decline" ? "Decline" : c.checkinAction.verb === "answer" ? "Answer" : "Accept";
    return { t: `${verb} check-in time in Booking.com`, k: "amber" };
  }
  const d = c.aiDraft;
  if (open && d && (d.text || d.reason)) {
    if (d.kind === "needs_you") return { t: `Needs you: ${d.reason || d.text}`, k: "red" };
    if (d.kind === "already_answered") return { t: "Answered on WhatsApp", k: "grey" };
    return { t: "AI draft: check it", k: "ink" };
  }
  if (closedAsThanks(c)) return { t: "Guest said thanks", k: "grey" };
  if (c.lastReplyBy === "AI" && (c.done || !c.needsReply)) return { t: "AI answered", k: "green" };
  if (needsReply(c)) return { t: "Answer this", k: "ink" };
  return null;
}
const TAG_CLASS = { red: "tag--red", amber: "tag--amber", green: "tag--green", grey: "tag--grey", ink: "tag--ink" };

/** The cancellation request card at the top of the chat, with a full-size button to answer it in Booking.com. */
function cancelCard(c) {
  const r = c.cancelRequest;
  if (!r) return "";
  if (isCancelled(c)) return `<div class="card card--grey"><div class="card__title">Booking was cancelled</div><div class="card__sub">The guest asked to cancel for free, and the booking is cancelled now. Nothing to answer.</div></div>`;
  const dl = toDate(r.deadline);
  const late = dl && dl.getTime() < Date.now();
  const text = !dl ? "Guest asks to cancel for free. Answer in Booking.com."
    : late ? `Guest asked to cancel for free. The answer was due in Booking.com by ${whenText(dl)}.`
    : `Guest asks to cancel for free, answer in Booking.com by ${whenText(dl)}.`;
  const url = reservationUrl(c);
  return `<div class="card ${late ? "card--amber" : "card--red"}"><div class="card__title">${icon("warn")} Cancellation request</div><div class="card__sub">${esc(text)}</div>
    ${url ? `<a class="btn btn--primary btn--full" href="${esc(url)}" target="_blank" rel="noopener">${icon("out")}Answer in Booking.com</a>` : ""}</div>`;
}

/** The check-in time request card at the top of the chat: what was asked, what we did, what is still to do. */
function checkinCard(c) {
  const r = c.checkinRequest;
  if (!r || c.done) return "";
  const asked = r.time ? `Guest asks to check in ${fmtRange(r.time)}.` : "Guest asks for a check-in time.";
  if (r.autoConfirmed) return `<div class="card card--grey"><div class="card__title">${esc(asked)}</div><div class="card__sub">Booking.com already confirmed this, nothing to do.</div></div>`;
  const h = c.checkinHandled;
  const act = c.checkinAction && c.checkinAction.url ? c.checkinAction : null;
  const ours = h && h.outcome === "sent" ? "Our message was sent." : h && h.outcome === "draft" ? "A draft message is ready below." : h ? "" : "We are checking this request.";
  const link = act ? act.url : checkinLinks[c.id];
  const verb = act ? (act.verb === "decline" ? "decline" : act.verb === "answer" ? "answer" : "accept") : "answer";
  return `<div class="card card--amber"><div class="card__title">${esc(asked)}</div>
    <div class="card__sub">${ours ? esc(ours) + " " : ""}Still to do: ${verb} it in Booking.com.</div>
    ${link ? `<a class="btn btn--primary btn--full" href="${esc(link)}" target="_blank" rel="noopener">${icon("out")}${esc(act ? act.label : "Answer in Booking.com")}</a>` : ""}</div>`;
}

function checkinLine(c) {
  const r = c.checkinRequest;
  if (!r) return "";
  const t = r.time ? fmtRange(r.time) : "time not read";
  return `Check-in time request: ${esc(t)}, ${r.autoConfirmed ? "auto-confirmed" : "not auto-confirmed"}`;
}

// The reservation's page in the Booking.com Extranet (for a cancellation request).
function reservationUrl(c) {
  if (!c.hotelId || !c.bookingNumber) return "";
  return `https://admin.booking.com/hotel/hoteladmin/extranet_ng/manage/booking.html?hotel_id=${encodeURIComponent(c.hotelId)}&res_id=${encodeURIComponent(c.bookingNumber)}`;
}

function extranetUrl(c) {
  if (!c.hotelId || !c.bookingNumber) return "";
  const n = encodeURIComponent(c.bookingNumber);
  return `https://admin.booking.com/hotel/hoteladmin/extranet_ng/manage/messaging/inbox.html?product_type=POST_BOOKING&product_id=${n}&hotel_id=${encodeURIComponent(c.hotelId)}&res_id=${n}&lang=en`;
}

/* ---------- alerts on this phone (owner only: the server accepts a phone only from my verified Google sign-in) ---------- */
const alertsSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let alertsOn = (() => { try { return localStorage.getItem("inbox_alerts_on") === "1"; } catch { return false; } })();
let alertsBusy = false;
const deviceId = () => {
  try {
    let id = localStorage.getItem("inbox_device_id");
    if (!id) { id = newId(); localStorage.setItem("inbox_device_id", id); }
    return id;
  } catch { return newId(); }
};
const alertsLabel = () => (alertsBusy ? "Alerts..." : alertsOn ? "Alerts on" : "Turn on alerts");
function paintAlerts() { const b = $("alertsBtn"); if (b) b.textContent = alertsLabel(); }
const b64ToBytes = s => { const p = "=".repeat((4 - (s.length % 4)) % 4); const r = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
async function checkAlertsStatus() {
  try {
    const r = await alertsFn({ action: "status", deviceId: deviceId() });
    alertsOn = !!(r.data && r.data.registered) && Notification.permission === "granted";
    try { localStorage.setItem("inbox_alerts_on", alertsOn ? "1" : "0"); } catch {}
    paintAlerts();
  } catch (e) { /* keep what we know */ }
}
async function toggleAlerts() {
  if (alertsBusy) return;
  if (!alertsSupported()) { alert("To get alerts, open the Maxela app from its Home Screen icon (not from Safari), then tap here."); return; }
  alertsBusy = true; paintAlerts();
  try {
    if (alertsOn) {
      if (!confirm("Turn off Booking.com message alerts on this phone?")) return;
      await alertsFn({ action: "unregister", deviceId: deviceId() });
      alertsOn = false;
    } else {
      const perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
      if (perm !== "granted") { alert(perm === "denied" ? "Notifications are blocked for this app. Turn them on in the phone Settings, then tap here again." : "Notifications were not allowed."); return; }
      const reg = await navigator.serviceWorker.register("/sw.js").then(() => navigator.serviceWorker.ready);
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        const { VAPID_PUBLIC_KEY } = await import("./shared/push-config.js");
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC_KEY) });
      }
      await alertsFn({ action: "register", deviceId: deviceId(), subscription: sub.toJSON(), userAgent: navigator.userAgent.slice(0, 100) });
      alertsOn = true;
    }
    try { localStorage.setItem("inbox_alerts_on", alertsOn ? "1" : "0"); } catch {}
  } catch (e) {
    alert("Alerts: " + ((e && e.message) || "something went wrong") + ".");
  } finally {
    alertsBusy = false; paintAlerts();
  }
}

/* App icon badge (iOS 16.4+ Home Screen app with notifications allowed): the Needs reply count. */
let lastBadge = -1;
function setBadge(n) {
  if (n === lastBadge) return; lastBadge = n;
  try { if (navigator.setAppBadge) { if (n > 0) navigator.setAppBadge(n); else navigator.clearAppBadge(); } } catch (e) { /* no badge here */ }
}

/* ---------- two people: what my screen has seen, and who else is here ---------- */
const seenLast = {};          // conversation -> id of the newest chat message my screen showed when the composer was opened
const latestMsgId = () => (msgs.length ? msgs[msgs.length - 1].id : null);
const PRESENCE_FRESH_MS = 60000;
const PRESENCE_BEAT_MS = 20000;
let presenceAll = {};         // conversation -> { person: { at, typing } } (everyone's records)
let presenceOk = true;        // turns false on the first "not allowed": the feature then stays hidden, no errors shown
const myKey = () => String((me && me.name) || "").toLowerCase();
const personName = key => (INBOX_PEOPLE[key] || key);
const INBOX_PEOPLE = { nika: "Nika", nutsa: "Nutsa" };
function othersHere(convId) {
  const rec = presenceAll[convId] || {}; const out = [];
  for (const [k, v] of Object.entries(rec)) {
    if (k === myKey() || !v || !Number.isFinite(Number(v.at)) || Date.now() - Number(v.at) > PRESENCE_FRESH_MS) continue;
    out.push({ key: k, name: personName(k), typing: !!v.typing });
  }
  return out;
}
const initialOf = name => (!name ? "" : name === "AI" ? "AI" : String(name).toLowerCase() === "nutsa" ? "Nu" : String(name).charAt(0).toUpperCase());
let presenceTyping = false, presenceTypingTimer = null, presenceBeat = null, presenceFor = null;
function writePresence(convId, typing) {
  if (!presenceOk || !me || !convId) return;
  setDoc(doc(db, "inbox_presence", convId), { [myKey()]: { at: Date.now(), typing: !!typing } }, { merge: true })
    .catch(e => { if (e && e.code === "permission-denied") { presenceOk = false; paintPresence(); } });
}
function startPresence(convId) {
  if (presenceFor === convId) return;
  stopPresence();
  presenceFor = convId; presenceTyping = false;
  writePresence(convId, false);
  presenceBeat = setInterval(() => { if (document.visibilityState === "visible") writePresence(convId, presenceTyping); }, PRESENCE_BEAT_MS);
}
function stopPresence() {
  if (presenceBeat) { clearInterval(presenceBeat); presenceBeat = null; }
  clearTimeout(presenceTypingTimer);
  if (presenceFor && presenceTyping) writePresence(presenceFor, false);
  presenceFor = null; presenceTyping = false;
}
function iAmTyping() {
  if (!presenceFor) return;
  if (!presenceTyping) { presenceTyping = true; writePresence(presenceFor, true); }
  clearTimeout(presenceTypingTimer);
  presenceTypingTimer = setTimeout(() => { presenceTyping = false; writePresence(presenceFor, false); }, 5000);
}
function paintPresence() {
  const el = $("presenceLine"); if (!el) return;
  const id = $("chatPane").dataset.conv;
  const o = presenceOk ? othersHere(id) : [];
  el.textContent = o.map(x => `${x.name} is ${x.typing ? "typing" : "viewing"}`).join(" \u00b7 ");
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && presenceFor) writePresence(presenceFor, presenceTyping); });
window.addEventListener("pagehide", () => stopPresence());
setInterval(() => { paintPresence(); }, 15000);

/* ---------- connected to the rest of the admin (Step 6) ---------- */
const panelCache = {};        // conversation -> the booking panel answer (facts + requests made from this chat)
async function loadPanel(id, force) {
  if (panelCache[id] && !force) return panelCache[id];
  try { panelCache[id] = (await bookingPanelFn({ bookingNumber: id })).data; }
  catch (e) { panelCache[id] = { error: (e && e.message) || "Could not load." }; }
  if ($("chatPane").dataset.conv === id) { paintOpenBooking(id); if (msgsFor === id) drawThread(); }
  return panelCache[id];
}
function requestBtn(id, m) {
  if (!m.id || String(m.id).startsWith("pending")) return "";
  const p = panelCache[id];
  const r = p && p.requests ? p.requests.find(x => x.messageId === m.id) : null;
  if (r) return `<div class="reqdone">Request created: ${esc(String(r.status || "PENDING").toLowerCase())}</div>`;
  return `<button class="reqbtn" type="button" data-req="${esc(m.id)}" data-conv="${esc(id)}">+ Request</button>`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest && e.target.closest("[data-req]"); if (!b) return;
  b.disabled = true; b.textContent = "Creating...";
  try {
    await requestCreateFn({ bookingNumber: b.dataset.conv, messageId: b.dataset.req });
    await loadPanel(b.dataset.conv, true);
    showToast("Request created. It is in the Requests list.");
  } catch (err) { showToast("Could not create the request: " + ((err && err.message) || "try again")); b.disabled = false; b.textContent = "+ Request"; }
});
function paintOpenBooking(id) {
  const b = $("openBookingBtn"); if (!b) return;
  const p = panelCache[id];
  const hc = p && p.reservationNumber;
  b.hidden = !hc;
  b.onclick = () => {
    if (EMBED) tellAdmin({ type: "open-booking", hc });
    else location.href = "/checkin-admin?hc=" + encodeURIComponent(hc);
  };
}
const fmtIso = s => { if (!s) return ""; const d = new Date(s + "T12:00:00Z"); return isNaN(d) ? s : fmt(d, { day: "numeric", month: "short" }); };
async function openBookingPanel(id) {
  let el = $("bpanel");
  if (!el) { el = document.createElement("div"); el.id = "bpanel"; $("chatPane").appendChild(el); }
  el.hidden = false;
  el.innerHTML = `<div class="head"><div class="head__row"><button class="iconbtn" id="bpClose" type="button" aria-label="Close">${icon("back")}Chat</button><div class="head__name">Booking</div></div></div><div class="pane__scroll"><div class="msg">Loading...</div></div>`;
  $("bpClose").onclick = () => { el.hidden = true; };
  const p = await loadPanel(id, true);
  if (el.hidden || $("chatPane").dataset.conv !== id) return;
  const row = (k, v) => (v ? `<div class="bp__row"><div class="bp__k">${esc(k)}</div><div class="bp__v">${esc(v)}</div></div>` : "");
  let body;
  if (p.error) body = `<div class="err">${esc(p.error)}</div>`;
  else {
    const r = p.reservation || {};
    body = row("Dates", r.checkin ? `${fmtIso(r.checkin)} to ${fmtIso(r.checkout)}${r.nights != null ? `, ${r.nights} night${r.nights === 1 ? "" : "s"}` : ""}` : "")
      + row("Room", r.room) + row("Guests", r.guests ? String(r.guests) : "") + row("Reservation status", r.status)
      + (p.form ? row("Check-in form", p.form.filled ? "Filled in" : "Not filled in yet") : "")
      + (p.access ? row("Door access", p.access.text) : "")
      + (p.cleaning ? row("Cleaning today", p.cleaning.text) : "")
      + (p.previous && p.previous.length ? row("Earlier stays (same name)", p.previous.map(x => `${fmtIso(x.checkin)} to ${fmtIso(x.checkout)}${x.room ? ", room " + x.room : ""}`).join("\n")) : "")
      + (!p.found ? `<div class="msg">This chat is not linked to a reservation yet.</div>` : "")
      + (p.notes && p.notes.length ? `<div class="msg">Some facts could not be read: ${esc(p.notes.join("; "))}</div>` : "");
  }
  el.innerHTML = `<div class="head"><div class="head__row"><button class="iconbtn" id="bpClose" type="button" aria-label="Close">${icon("back")}Chat</button><div class="head__name">Booking</div></div></div><div class="pane__scroll" style="white-space:pre-line">${body}</div>`;
  $("bpClose").onclick = () => { el.hidden = true; };
}

/* ---------- keeping an eye on the AI (Step 5) ---------- */
const aiPaused = c => Number(c && c.aiPausedUntil) > Date.now();
const tbilisiDayStart = () => { const d = new Date(Date.now() + 4 * 3600000); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - 4 * 3600000; };
const lastAi = c => (c && c.aiLastReply ? c.aiLastReply : null);
const aiToReview = () => convs.filter(c => { const l = lastAi(c); return l && !l.review && toDate(l.at) && toDate(l.at).getTime() >= Date.now() - 7 * 86400000; });
const topicWords = t => (t || []).map(x => String(x).replace(/_/g, " ")).join(", ");
async function aiAct(id, payload, okText) {
  try { await aiActionFn({ bookingNumber: id, ...payload }); if (okText) showToast(okText); }
  catch (e) { showToast("Could not do that: " + ((e && e.message) || "try again")); }
}
function aiExtras(c, m) {
  const l = lastAi(c);
  if (!l || l.messageId !== m.id) return "";
  const out = [];
  if (l.topics && l.topics.length) out.push(`<div class="aiwhy">Topic: ${esc(topicWords(l.topics))}</div>`);
  if (l.flags && l.flags.length) out.push(`<div class="aiwhy aiwhy--warn">Check this reply: it may contain ${esc(l.flags.join(", "))}.</div>`);
  if (!l.review) out.push(`<div class="aiwhy__btns"><button type="button" data-aireview="ok" data-conv="${esc(c.id)}">Looks good</button><button type="button" data-aireview="wrong" data-conv="${esc(c.id)}">Wrong</button></div>`);
  else out.push(`<div class="aiwhy">${l.review === "ok" ? "Marked: looks good" : "Marked: wrong"}${l.reviewedBy ? " by " + esc(l.reviewedBy) : ""}</div>`);

}
async function aiReview(id, verdict) {
  let correction = "";
  if (verdict === "wrong") { const t = window.prompt("What should it have said? (You can leave this empty. Nothing changes until you approve it in AI knowledge.)", ""); if (t === null) return; correction = t; }
  await aiAct(id, { action: "review", verdict, correction }, verdict === "ok" ? "Marked as looks good." : correction.trim() ? "Saved as a suggestion. Approve it in AI knowledge." : "Marked as wrong.");

document.addEventListener("click", e => { const b = e.target.closest && e.target.closest("[data-aireview]"); if (b) aiReview(b.dataset.conv, b.dataset.aireview); });

/* "AI will reply in 0:45" with Stop, or the pause note, above the draft box */
let aiWaitTimer = null;
function paintAiWait(c) {
  const el = $("aiWait"); if (!el) return;
  clearInterval(aiWaitTimer);
  const id = c.id;
  const paint = () => {
    const live = $("aiWait"); if (!live || $("chatPane").dataset.conv !== id) { clearInterval(aiWaitTimer); return; }
    if (live.dataset.pausing === id) return;
    const cur = convs.find(x => x.id === id) || c;
    if (aiPaused(cur)) {
      live.innerHTML = `<span class="aiwait__t">AI is paused for this guest until ${esc(fmtDay(new Date(cur.aiPausedUntil)))}, ${esc(fmtClock(new Date(cur.aiPausedUntil)))}.</span><button class="btn" id="awResume" type="button">Resume AI</button>`;
      $("awResume").onclick = () => aiAct(id, { action: "resume" }, "AI resumed for this guest.");
      return;
    }
    const due = toDate(cur.aiDueAt);
    if (aiMode && aiMode !== "off" && cur.aiPending && due && due.getTime() > Date.now()) {
      const left = Math.max(0, Math.round((due.getTime() - Date.now()) / 1000));
      const verb = aiMode === "auto" ? "reply" : "write a draft";
      live.innerHTML = `<span class="aiwait__t">AI will ${verb} in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}</span><button class="btn" id="awStop" type="button">Stop</button><button class="btn" id="awMine" type="button">Write it myself</button>`;
      $("awStop").onclick = () => aiAct(id, { action: "stop" }, "The AI will not answer this one.");
      $("awMine").onclick = async () => { await aiAct(id, { action: "stop" }); const ta = $("replyText"); if (ta) ta.focus(); };
    } else live.innerHTML = "";
  };
  paint();
  aiWaitTimer = setInterval(paint, 1000);
}
function showPauseChoices(id) {
  const el = $("aiWait"); if (!el) return;
  el.dataset.pausing = id;
  el.innerHTML = `<span class="aiwait__t">Pause the AI for this guest:</span><button class="btn" id="pz24" type="button">24 hours</button><button class="btn" id="pzCo" type="button">Until check-out</button><button class="btn" id="pzNo" type="button">Cancel</button>`;
  const done = () => { delete el.dataset.pausing; const c = convs.find(x => x.id === id); if (c) paintAiWait(c); };
  $("pz24").onclick = async () => { await aiAct(id, { action: "pause", mode: "24h" }, "AI paused for 24 hours."); done(); };
  $("pzCo").onclick = async () => { await aiAct(id, { action: "pause", mode: "checkout" }, "AI paused until check-out."); done(); };

async function addAnswerFor(reason) {
  const question = window.prompt("The question a guest asks:", reason); if (question === null || !dash(question)) return;
  const answer = window.prompt("What should the AI answer? (It is only a suggestion until you approve it in AI knowledge.)", ""); if (answer === null || !dash(answer)) return;

  catch (e) { showToast("Could not save: " + ((e && e.message) || "try again")); }
}
async function runTestBox() {
  const q = $("tbQ").value.trim(); if (!q) return;
  const out = $("tbOut"), b = $("tbGo"); b.disabled = true; out.textContent = "Thinking...";
  try {
    const r = (await aiKnowledgeFn({ action: "test", question: q, room: $("tbRoom").value.trim() })).data;
    const topics = r.topics && r.topics.length ? `<div class="rv__meta">Topic: ${esc(topicWords(r.topics))}</div>` : "";
    out.innerHTML = r.kind === "reply"
      ? `<div class="rv"><div class="rv__meta">The AI would answer:</div><div class="rv__text">${esc(r.reply)}</div>${topics}${r.scan && r.scan.length ? `<div class="aiwhy aiwhy--warn" style="text-align:left">Check this reply: it may contain ${esc(r.scan.join(", "))}.</div>` : ""}</div>`
      : `<div class="rv"><div class="rv__meta">The AI would not answer this by itself:</div><div class="rv__text">${esc(r.reason || "")}</div>${topics}</div>`;
  } catch (e) { out.textContent = "Could not test: " + ((e && e.message) || "try again"); }
  b.disabled = false;
}

let knowItems = null, knowError = "";
async function loadKnowledge() {
  try { knowItems = (await aiKnowledgeFn({ action: "list" })).data.items; knowError = ""; }
  catch (e) { knowError = (e && e.message) || "Could not load."; }

function renderKnowledge() {
  const pane = $("chatPane");

}
function drawKnowledge() {
  const el = $("kScroll"); if (!el) return;
  if (knowError) { el.innerHTML = `<div class="err">${esc(knowError)}</div>`; return; }
  if (!knowItems) { el.innerHTML = `<div class="msg">Loading...</div>`; return; }
  const card = (i, btns) => `<div class="rv"><div class="rv__reason">${esc(i.question)}</div><div class="rv__text">${esc(i.answer)}</div>
    ${i.wrongReply ? `<div class="rv__meta">The AI had said: ${esc(i.wrongReply)}</div>` : ""}
    <div class="rv__meta">${esc(i.by || "")}${i.updatedAt ? " . " + esc(fmtDay(new Date(i.updatedAt))) : ""}</div><div class="rv__btns">${btns}</div></div>`;
  const b = (k, i, t, on) => `<button class="btn" type="button" data-k="${k}" data-id="${esc(i.id)}"${on !== undefined ? ` data-on="${on}"` : ""}>${t}</button>`;
  const pend = knowItems.filter(i => i.status === "pending"), appr = knowItems.filter(i => i.status === "approved");
  el.innerHTML = `<div class="sect">Suggestions<small>${pend.length}</small></div><div class="stack">${aiRows(pend, i => card(i, b("approve", i, "Approve") + b("edit", i, "Edit") + b("reject", i, "Reject")), "No suggestions waiting.")}</div>
    <div class="sect">Approved answers<small>${appr.length}</small></div><div class="stack">${aiRows(appr, i => card(i, `<span class="tag ${i.enabled ? "tag--green" : ""}">${i.enabled ? "On" : "Off"}</span>` + b("toggle", i, i.enabled ? "Switch off" : "Switch on", i.enabled ? "0" : "1") + b("edit", i, "Edit")), "Nothing approved yet.")}</div><div style="height:24px"></div>`;
}
async function knowledgeAct(k, id, on) {
  const it = (knowItems || []).find(x => x.id === id); if (!it) return;
  try {
    if (k === "edit" || (k === "approve" && false)) {
      const q = window.prompt("Question:", it.question); if (q === null) return;
      const a = window.prompt("Answer:", it.answer); if (a === null) return;
      await aiKnowledgeFn({ action: "edit", id, question: q, answer: a });
    } else if (k === "approve") { if (!window.confirm("Approve this answer? The Booking.com AI will start using it.")) return; await aiKnowledgeFn({ action: "approve", id }); }
    else if (k === "reject") await aiKnowledgeFn({ action: "reject", id });
    else if (k === "toggle") await aiKnowledgeFn({ action: "toggle", id, enabled: on === "1" });
  } catch (e) { showToast("Could not do that: " + ((e && e.message) || "try again")); }
  loadKnowledge();
}

/* ---------- routing ---------- */
const route = () => {
  const h = location.hash.replace(/^#/, "");
  if (h === "review") return { page: "review" };
  if (h === "ai") return { page: "ai" };
  if (h === "knowledge") return { page: "knowledge" };
  if (h.startsWith("c/")) return { page: "conv", id: decodeURIComponent(h.slice(2)) };
  return { page: "list" };
};
const go = h => { location.hash = h; };
let lastRoutePage = "list";
window.addEventListener("hashchange", () => {
  const r = route();
  cameFromList = r.page === "conv" && lastRoutePage === "list";     // opened from the list in this visit
  lastRoutePage = r.page;
  if (started) render();
});
const goBackToList = () => { if (cameFromList && history.length > 1) { cameFromList = false; history.back(); } else go(""); };

/* ---------- render ---------- */
function render() {
  const r = route();
  tellAdmin({ type: "route", page: r.page, id: r.page === "conv" ? r.id : null });
  document.body.classList.toggle("show-chat", r.page !== "list");
  renderList(r);
  if (r.page !== "conv") stopMsgs();
  if (r.page === "conv") renderConv(r.id);
  else if (r.page === "review") renderReview();
  else if (r.page === "ai") renderAiView();
  else if (r.page === "knowledge") renderKnowledge();
  else renderPlaceholder();
}

function renderList(r) {
  if (!topBuilt) buildListTop();
  const vis = convs.filter(visible).sort((a, b) => activityTime(b) - activityTime(a));
  const nNeeds = vis.filter(needsReply).length;
  // the listing filter keeps its choices in step with the conversations
  const listings = [...new Set(vis.map(c => c.propertyName).filter(Boolean))].sort();
  if (vis.some(c => !c.propertyName)) listings.push(NO_LISTING);       // chats whose email had no listing name are never hidden
  const sel = $("listingSel");
  if (sel.options.length !== listings.length + 1 || [...sel.options].slice(1).some((o, i) => o.value !== listings[i])) {
    sel.innerHTML = `<option value="">All listings</option>` + listings.map(l => `<option value="${esc(l)}">${esc(l === NO_LISTING ? "Listing not named" : l)}</option>`).join("");
  }
  sel.value = listings.includes(listingFilter) ? listingFilter : "";
  const q = searchQ.trim().toLowerCase();
  const matches = c => !q || [c.guestName, c.bookingNumber, c.roomCode, c.propertyName, c.lastMessagePreview].some(x => String(x || "").toLowerCase().includes(q));
  const rows = vis.filter(c => (!listingFilter || (listingFilter === NO_LISTING ? !c.propertyName : c.propertyName === listingFilter)) && matches(c))
    .filter(c => tab === "needs" ? needsReply(c) : tab === "done" ? !!c.done : true);
  // Needs reply: the guest who has waited longest first.
  if (tab === "needs") rows.sort((a, b) => waitSince(a) - waitSince(b));
  $("listTop").querySelectorAll(".tab").forEach(b => {
    b.classList.toggle("on", b.dataset.tab === tab);
    if (b.dataset.tab === "needs") { b.innerHTML = `Needs reply<small>${nNeeds}</small>`; setBadge(nNeeds); }
  });
  $("reviewBtn").textContent = `Other Booking.com emails (${reviewItems.length})`;
  const nRev = aiToReview().length;
  $("aiViewBtn").textContent = `AI view${nRev ? ` (${nRev} to review)` : ""}`;
  $("alertsBtn").textContent = alertsLabel();
  $("whoAmI").textContent = me ? `Signed in as ${me.name}` : "";
  paintAiChip();

  const body = $("listBody");
  const viewKey = `${tab}|${searchQ}|${listingFilter}`;
  const keep = lastRenderedTab === viewKey ? body.scrollTop : 0;  // a new tab or search starts at the top; a live update keeps the place
  lastRenderedTab = viewKey;
  let html;
  if (loadError) html = `<div class="err">${esc(loadError)}</div>`;
  else if (!loaded.convs) html = `<div class="msg">Loading...</div>`;
  else if (!rows.length && (q || listingFilter)) html = `<div class="empty">Nothing matches. Clear the search or choose All listings.</div>`;
  else if (!rows.length) html = `<div class="empty">${tab === "needs" ? "Nothing waiting for a reply." : tab === "done" ? "Nothing marked done yet." : "No conversations yet."}</div>`;
  else html = `<div class="list">${rows.map(c => rowHtml(c, r.page === "conv" && r.id === c.id)).join("")}</div>`;
  body.innerHTML = html;
  body.scrollTop = keep;
  body.querySelectorAll(".row").forEach(b => b.onclick = () => go("c/" + encodeURIComponent(b.dataset.id)));
}

function rowHtml(c, selected) {
  const t = toDate(c.lastMessageAt) || toDate(c.cancelRequest?.at) || toDate(c.checkinRequest?.at);
  const tags = [];
  const a = actionTag(c);
  if (a) tags.push(`<span class="tag ${TAG_CLASS[a.k] || ""}">${esc(a.t)}</span>`);
  if (isCancelled(c) && !(a && a.t === "Booking was cancelled")) tags.push('<span class="tag tag--red">Cancelled</span>');
  if (c.done && tab === "all") tags.push('<span class="tag tag--green">Done</span>');
  const here = presenceOk ? othersHere(c.id) : [];
  here.forEach(h => tags.push(`<span class="who who--live" title="${esc(h.name)} is ${h.typing ? "typing" : "viewing"}">${esc(initialOf(h.name))} ${h.typing ? "typing" : "viewing"}</span>`));
  if (c.lastReplyBy && (c.done || !needsReply(c))) tags.push(`<span class="who" title="Last reply by ${esc(c.lastReplyBy)}">${esc(initialOf(c.lastReplyBy))}</span>`);
  const unread = needsReply(c);
  if (unread) tags.push(`<span class="row__wait">waiting ${esc(fmtWait(Date.now() - waitSince(c)))}</span>`);
  const prev = c.lastMessagePreview || (hasChat(c) ? "" : c.checkinRequest ? "Check-in time request" : "No chat messages");
  return `<button class="row ${unread ? "unread" : ""} ${selected ? "sel" : ""}" type="button" data-id="${esc(c.id)}">
    <div class="row__top">${unread ? '<span class="dot" title="Needs reply"></span>' : ""}
      <span class="row__name">${esc(c.guestName || "Guest")}</span><span class="row__time">${esc(fmtListTime(t))}</span></div>
    <div class="row__meta">${c.roomCode ? `<span class="row__room">${esc(c.roomCode)}</span> ` : ""}<span class="row__listing">${esc(c.propertyName || "")}</span>${stayText(c) ? ` \u00b7 ${esc(stayText(c))}` : ""}</div>
    ${prev ? `<div class="row__prev">${esc(prev)}</div>` : ""}
    <div class="tags">${tags.join("")}</div></button>`;
}

/* ---------- conversation ---------- */
const MAX_REPLY = 2000;
const drafts = {};              // bookingNumber -> unsent text, kept while you move around
const checkinLinks = {};        // bookingNumber -> url | false (false: asked, none found)
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2, 12));

function renderConv(id) {
  const c = convs.find(x => x.id === id);
  if (msgsFor !== id) {
    stopMsgs();
    msgsFor = id;
    msgUnsub = onSnapshot(query(collection(db, "inbox_conversations", id, "messages"), orderBy("sentAt", "asc")),
      s => {
        msgs = s.docs.map(d => ({ id: d.id, ...d.data() }));
        const seen = new Set(msgs.map(m => m.id));
        if (pending[id]) pending[id] = pending[id].filter(p => !seen.has(p.id));
        if (route().page === "conv" && route().id === id) drawThread();
      },
      e => { $("thread") && ($("thread").innerHTML = `<div class="err">Could not load messages (${esc(e.code || e.message)}).</div>`); });
  }
  const pane = $("chatPane");
  if (!c) {
    pane.dataset.conv = "";
    pane.innerHTML = `<div class="head"><div class="head__row"><button class="iconbtn only-narrow" id="backBtn" type="button" aria-label="Back to the list">${icon("back")}Inbox</button></div></div>
      <div class="placeholder">${loaded.convs ? "No messages yet." : "Loading..."}</div>`;
    if ($("backBtn")) $("backBtn").onclick = goBackToList;
    return;
  }
  // Built once per conversation, so a live update never wipes what you are typing.
  if (pane.dataset.conv !== id) {
    pane.dataset.conv = id;
    pane.innerHTML = `<div class="head" id="convHead"></div><div class="thread" id="thread"></div><div class="aiwait" id="aiWait"></div><div id="draftSlot" data-key=""></div><div class="reply" id="replyBar"></div>`;
    buildReplyBar(id);
  }
  startPresence(id); paintPresence();
  drawHead(c);
  paintAiWait(c);
  if (!panelCache[id]) loadPanel(id);
  drawDraft(c);
  const canReply = /@guest\.booking\.com$/i.test(c.replyTo || "");
  $("replyBar").style.display = canReply ? "" : "none";
  if (c.checkinRequest && !c.checkinRequest.autoConfirmed && !(c.checkinAction && c.checkinAction.url) && checkinLinks[id] === undefined) {
    checkinLinks[id] = false;
    checkinLinkFn({ bookingNumber: id }).then(r => { checkinLinks[id] = (r.data && r.data.url) || false; if (msgsFor === id) drawThread(); }).catch(() => {});
  }
  drawThread();
}

let toastTimer = null;
function showToast(text, undo) {
  let t = $("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(text)}</span>${undo ? `<button type="button" id="toastUndo">Undo</button>` : ""}`;
  t.style.display = "flex";
  if (undo) $("toastUndo").onclick = () => { t.style.display = "none"; undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 5000);
}
const isNarrow = () => !window.matchMedia("(min-width:860px)").matches;

function drawHead(c) {
  const id = c.id;
  const url = extranetUrl(c);
  const st = statusLabel(c);
  $("convHead").innerHTML = `
    <div class="head__row"><button class="iconbtn only-narrow" id="backBtn" type="button" aria-label="Back to the list">${icon("back")}Inbox</button>
      <div class="head__name">${esc(c.guestName || "Guest")}</div>
      ${st ? `<span class="tag ${isCancelled(c) ? "tag--red" : "tag--green"}">${esc(st)}</span>` : ""}
      <button class="iconbtn head__more" id="moreBtn" type="button" aria-label="More">${icon("more")}</button></div>
    <div class="head__line">${esc(propLine(c))}</div>
    <div class="head__line">${esc(stayText(c))}${c.bookingNumber ? ` \u00b7 Booking ${esc(c.bookingNumber)}` : ""}</div>
    ${cancelCard(c)}
    ${checkinCard(c)}
    <div class="actions">
      <button class="btn" id="doneBtn" type="button">${c.done ? icon("undo") + "Not done" : icon("check") + "Done"}</button>
      ${url ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${icon("out")}Open in Booking.com</a>` : ""}
      <button class="btn" id="bookingBtn" type="button">Booking details</button>
      <button class="btn" id="openBookingBtn" type="button" hidden>Open booking</button>
      ${aiMode && aiMode !== "off" ? `<button class="btn" id="pauseAiBtn" type="button">${aiPaused(c) ? "Resume AI" : "Pause AI"}</button>` : ""}
    </div>`;
  tellAdmin({ type: "title", title: c.guestName || "Guest" });
  $("backBtn").onclick = goBackToList;
  const mb = $("moreBtn");
  mb.addEventListener("pointerdown", e => e.preventDefault());     // keeps the keyboard open
  mb.onclick = () => $("chatPane").classList.toggle("menu-open");
  $("bookingBtn").onclick = () => { $("chatPane").classList.remove("menu-open"); openBookingPanel(id); };
  paintOpenBooking(id);
  if ($("pauseAiBtn")) $("pauseAiBtn").onclick = () => { $("chatPane").classList.remove("menu-open"); if (aiPaused(c)) aiAct(id, { action: "resume" }); else showPauseChoices(id); };
  $("doneBtn").onclick = async e => {
    const b = e.currentTarget; b.disabled = true;
    const toDone = !c.done;
    try {
      await updateDoc(doc(db, "inbox_conversations", id), toDone ? { done: true, doneAt: serverTimestamp() } : { done: false, doneAt: null });
      if (toDone) {
        showToast("Moved to Done.", async () => {
          try { await updateDoc(doc(db, "inbox_conversations", id), { done: false, doneAt: null }); } catch (err) { alert("Could not undo (" + (err.code || err.message) + ")."); }
        });
        if (isNarrow()) go("");          // on a phone, back to the list
      }
    } catch (err) { alert("Could not save (" + (err.code || err.message) + ")."); b.disabled = false; }
  };
}

function statusHtml(m, laterSame, c) {
  const st = m.status || "waiting";
  if (st === "sent") return `<span class="me__status--ok">Sent to Booking.com</span>`;
  if (st === "sending" || st === "waiting") return `<span class="me__status--wait">Sending...</span>`;
  if (st === "failed") return `<span class="me__status--bad">Not sent${m.failReason ? " (" + esc(m.failReason) + ")" : ""}</span>` +
    (laterSame ? "" : `<button class="mini" type="button" data-retry="${esc(m.id)}">Try again</button>`);
  if (st === "unknown") {
    const u = c ? extranetUrl(c) : "";
    return `<span class="me__status--bad">Not sure it arrived</span>` + (u ? `<a class="mini mini--link" href="${esc(u)}" target="_blank" rel="noopener">Open in Booking.com</a>` : "");
  }
  return `<span class="me__status--wait">Sending...</span>`;
}

function drawThread() {
  const el = $("thread"); if (!el) return;
  const id = msgsFor;
  const c = convs.find(x => x.id === id);
  const wasFirst = el.dataset.drawn !== id;
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 90;
  const prevCount = Number(el.dataset.count || 0);
  const prevTop = el.scrollTop;

  if (seenLast[id] === undefined && msgs.length) seenLast[id] = latestMsgId();
  const items = [...msgs];
  for (const p of pending[id] || []) items.push({ id: p.id, direction: "host", text: p.text, status: "waiting", sentAt: p.sentAt, sentByName: p.by });
  items.sort((a, b) => (toDate(a.sentAt)?.getTime() || 0) - (toDate(b.sentAt)?.getTime() || 0));

  const out = [];
  let lastDay = "";
  items.forEach((m, i) => {
    const d = toDate(m.sentAt);
    if (d && dayKey(d) !== lastDay) { lastDay = dayKey(d); out.push(`<div class="day">${esc(dayLabel(d))}</div>`); }
    const time = d ? esc(fmtClock(d)) : "";
    if (m.direction === "host") {
      const laterSame = items.slice(i + 1).some(x => x.direction === "host" && x.text === m.text && x.status !== "failed");
      const byAi = String(m.sentBy || "").toLowerCase() === "ai" || m.sentByName === "AI";
      out.push(byAi
        ? `<div class="me"><div class="ai-label">AI assistant</div><div class="bubble--ai">${esc(m.text)}</div>
          <div class="me__status">${time}${time ? " · " : ""}${statusHtml(m, laterSame, c)}</div>${aiExtras(c, m)}</div>`
        : `<div class="me"><div class="bubble--me">${esc(m.text)}</div>
          <div class="me__status">${time}${time ? " · " : ""}${m.sentByName ? esc(m.sentByName) + " · " : ""}${statusHtml(m, laterSame, c)}</div></div>`);
    } else {
      out.push(`<div class="bubble">${esc(m.text)}<div class="bubble__time">${time}</div></div>${requestBtn(id, m)}`);
    }
  });
  const line = c ? checkinLine(c) : "";
  if (line) out.push(`<div class="note">${line}</div>`);     // the button to answer it is in the card at the top
  if (c && closedAsThanks(c)) out.push(`<div class="note">Guest said thanks, nothing to answer.</div>`);
  el.innerHTML = out.length ? out.join("") : `<div class="msg">No chat messages yet.</div>`;
  el.querySelectorAll("[data-retry]").forEach(b => b.onclick = () => {
    const m = items.find(x => x.id === b.dataset.retry);
    if (m) { b.disabled = true; doSend(id, m.text, true); }
  });

  if (c) drawDraft(c);
  el.dataset.drawn = id; el.dataset.count = String(items.length);
  const lastIsMine = items.length && items[items.length - 1].direction === "host";
  // Opens on the newest message; follows new ones when you are at the bottom or just replied.
  if (wasFirst || (items.length > prevCount && (nearBottom || lastIsMine))) el.scrollTop = el.scrollHeight;
  else el.scrollTop = prevTop;
}

/* ---------- AI draft (never sent without my tap) ---------- */
const hiddenDrafts = {};        // bookingNumber -> createdAt (ms) of a draft I already dealt with on this screen
function drawDraft(c) {
  const slot = $("draftSlot");
  if (!slot) return;
  const d = c.aiDraft;
  const created = d ? (toDate(d.createdAt)?.getTime() || 0) : 0;
  const answeredAfter = msgs.some(m => m.direction === "host" && (toDate(m.sentAt)?.getTime() || 0) >= created);
  if (!d || !d.text || hiddenDrafts[c.id] === created || (created && answeredAfter)) { slot.innerHTML = ""; slot.dataset.key = ""; return; }
  const id = c.id;
  const kind = d.kind || "reply";
  const key = id + ":" + created + ":" + kind;
  if (slot.dataset.key === key) return;            // already showing this one, leave the buttons alone
  slot.dataset.key = key;
  if (kind === "reply") {
    // Why this is only a draft: held back by a rule, or the AI is in Drafts mode.
    const why = d.autoBlocked ? `Held back: ${d.autoBlocked}.`
      : d.needsYouReason ? `Needs you: ${d.needsYouReason}. This reply promises nothing.`
      : aiMode === "drafts" ? "The AI assistant is in Drafts mode, so it never sends by itself." : "";
    slot.innerHTML = `<div class="draft"><div class="draft__title">AI draft, not sent yet</div>
      ${why ? `<div class="draft__why">${esc(why)}</div>` : ""}
      ${guestAddr(c) ? "" : `<div class="draft__why">This conversation has no guest reply address, so nothing can be sent from here. Answer it in Booking.com.</div>`}
      <div class="draft__text">${esc(d.text)}</div>
      ${d.actionUrl ? `<a class="linkbtn" href="${esc(d.actionUrl)}" target="_blank" rel="noopener">${esc(d.actionLabel || "Answer in Booking.com")}</a>` : ""}
      <div class="draft__btns"><button class="btn btn--primary" id="dSend" type="button" ${guestAddr(c) ? "" : "disabled"}>Send this reply</button><button class="btn" id="dEdit" type="button">Edit</button><button class="btn" id="dDiscard" type="button">Discard</button></div></div>`;
    $("dSend").onclick = () => {
      const ta = $("replyText"); if (!ta || !guestAddr(c)) return;
      ta.value = d.text; drafts[id] = d.text; ta.dispatchEvent(new Event("input"));
      trySend(id);
    };
    $("dEdit").onclick = () => {
      const ta = $("replyText"); if (!ta) return;
      ta.value = d.text; drafts[id] = d.text; ta.dispatchEvent(new Event("input")); ta.focus();
      hiddenDrafts[id] = created; slot.dataset.key = ""; slot.innerHTML = "";
    };
  } else if (kind === "needs_you") {
    slot.innerHTML = `<div class="draft draft--needs"><div class="draft__title">AI needs you: ${esc(d.reason || d.text)}</div>
      <div class="draft__why">The AI assistant did not send anything.</div>
      <div class="draft__btns"><button class="btn" id="dDiscard" type="button">Dismiss</button></div></div>`;
  } else {
    // "Already answered on WhatsApp at 13:30: <what was answered>"
    const m = String(d.text || "").match(/^Already answered on WhatsApp at (\d{1,2}:\d{2}):\s*([\s\S]*)$/);
    slot.innerHTML = `<div class="draft draft--info"><div class="draft__title">Already answered on WhatsApp${m ? " at " + esc(m[1]) : ""}</div>
      <div class="draft__text">${esc(m ? m[2] : d.text)}</div>
      <div class="draft__btns"><button class="btn" id="dDiscard" type="button">Dismiss</button></div></div>`;
  }
  $("dDiscard").onclick = async () => {
    hiddenDrafts[id] = created; slot.dataset.key = ""; slot.innerHTML = "";
    try { await discardDraftFn({ bookingNumber: id }); } catch (e) { /* hidden here already; the server copy goes at the next reply */ }
  };
}

/* ---------- composer ---------- */
function buildReplyBar(id) {
  const bar = $("replyBar");
  bar.innerHTML = `<div class="presence" id="presenceLine"></div><div id="replyWarn"></div><div class="reply__err" id="replyErr" hidden></div>
    <div class="reply__row"><textarea id="replyText" rows="1" maxlength="${MAX_REPLY + 200}" placeholder="Write a reply to the guest" aria-label="Reply to the guest" enterkeyhint="${IS_TOUCH ? "enter" : "send"}"></textarea>
    <button class="btn btn--primary" id="sendBtn" type="button">Send</button></div>
    <div class="reply__count" id="replyCount"></div>
    ${IS_TOUCH ? "" : `<div class="reply__hint">Enter sends, Shift+Enter makes a new line.</div>`}`;
  const ta = $("replyText");
  ta.value = drafts[id] || "";
  const fit = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, window.innerHeight * 0.4) + "px"; };
  const count = () => { const n = ta.value.length; $("replyCount").textContent = n > MAX_REPLY * 0.8 ? `${n} / ${MAX_REPLY}` : ""; };
  const syncSend = () => { const b = $("sendBtn"); if (b) b.disabled = !ta.value.trim() || !!sendingNow[id]; };
  ta.oninput = () => { iAmTyping(); drafts[id] = ta.value; $("replyWarn").innerHTML = ""; $("replyErr").hidden = true; fit(); count(); syncSend(); };
  ta.addEventListener("focus", () => { tellAdmin({ type: "composer", focused: true }); if (isNarrow()) $("chatPane").classList.add("typing"); });
  ta.addEventListener("blur", () => { tellAdmin({ type: "composer", focused: false }); $("chatPane").classList.remove("typing", "menu-open"); });
  syncSend();
  ta.onkeydown = e => {
    if (e.key === "Enter" && !e.shiftKey && !IS_TOUCH && !e.isComposing) { e.preventDefault(); trySend(id); }
  };
  fit(); count();
  const btn = $("sendBtn");
  btn.addEventListener("pointerdown", e => e.preventDefault());   // keeps the keyboard open on a phone
  btn.onclick = () => trySend(id);
  if (!IS_TOUCH) ta.focus();
}

function ago(ms) { const m = Math.max(0, Math.round((Date.now() - ms) / 60000)); return m < 1 ? "just now" : m === 1 ? "1 min ago" : m < 60 ? m + " min ago" : Math.round(m / 60) + " h ago"; }
function showConflict(id, cf) {
  const head = cf.kind === "guest" ? "The guest wrote again" : `${cf.by} replied ${ago(cf.at)}`;
  $("replyWarn").innerHTML = `<div class="wbox"><strong>${esc(head)}</strong><div class="wbox__quote">${esc(cf.preview || "")}</div>
    <div class="wbox__btns"><button class="btn" id="cfMine" type="button">Send mine anyway</button><button class="btn" id="cfEdit" type="button">Edit</button><button class="btn" id="cfDiscard" type="button">Discard</button></div></div>`;
  const ta = $("replyText");
  $("cfMine").onclick = () => { $("replyWarn").innerHTML = ""; const t = ta.value.trim(); if (t) doSend(id, t, false, true); };
  $("cfEdit").onclick = () => { seenLast[id] = latestMsgId(); $("replyWarn").innerHTML = ""; ta.focus(); };
  $("cfDiscard").onclick = () => { $("replyWarn").innerHTML = ""; ta.value = ""; drafts[id] = ""; ta.dispatchEvent(new Event("input")); seenLast[id] = latestMsgId(); };
}

function trySend(id, force) {
  const ta = $("replyText");
  const text = ta.value.trim();
  const err = $("replyErr");
  err.hidden = true;
  if (!text || sendingNow[id]) return;
  if (text.length > MAX_REPLY) { err.textContent = `The message is too long (${text.length} of ${MAX_REPLY} characters).`; err.hidden = false; return; }
  const w = force ? [] : replyWarnings(text);
  if (w.length) {
    $("replyWarn").innerHTML = `<div class="wbox"><strong>Check before sending</strong><ul>${w.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <div class="wbox__btns"><button class="btn btn--primary" id="warnSend" type="button">Send anyway</button><button class="btn" id="warnEdit" type="button">Edit</button></div></div>`;
    $("warnSend").onclick = () => { $("replyWarn").innerHTML = ""; trySend(id, true); };
    $("warnEdit").onclick = () => { $("replyWarn").innerHTML = ""; ta.focus(); };
    return;
  }
  $("replyWarn").innerHTML = "";
  doSend(id, text, false);
}

async function doSend(id, text, isRetry, force) {
  if (sendingNow[id]) return;
  sendingNow[id] = true;
  const clientId = newId();
  const sb0 = $("sendBtn"); if (sb0) sb0.disabled = true;
  const ta = $("replyText");
  // My bubble shows at once; the box clears and keeps focus.
  (pending[id] = pending[id] || []).push({ id: clientId, text, sentAt: new Date(), by: me && me.name });
  if (!isRetry && ta && msgsFor === id) {
    ta.value = ""; drafts[id] = ""; ta.style.height = "auto"; $("replyCount").textContent = ""; $("replyErr").hidden = true;
    ta.focus();
  }
  if (msgsFor === id) drawThread();
  try {
    const res = await sendReplyFn({ bookingNumber: id, text, clientId, ...(isRetry ? {} : { seenLastId: seenLast[id] || undefined }), ...(force ? { force: true } : {}) });
    const out = res && res.data;
    if (out && out.ok === false && out.conflict) {
      // Something new arrived since this screen last showed the chat: nothing was sent.
      pending[id] = (pending[id] || []).filter(p => p.id !== clientId);
      const box = $("replyText");
      if (msgsFor === id && box) { if (!box.value) { box.value = text; drafts[id] = text; box.dispatchEvent(new Event("input")); } drawThread(); showConflict(id, out.conflict); }
    } else delete seenLast[id];       // sent: the next reply starts from what the chat shows after this one
  } catch (e) {
    pending[id] = (pending[id] || []).filter(p => p.id !== clientId);
    const m = (e && e.message) || "Could not send.";
    const box = $("replyText");
    if (msgsFor === id) {
      if (!isRetry && box && !box.value) { box.value = text; drafts[id] = text; box.dispatchEvent(new Event("input")); }
      const er = $("replyErr");
      if (er) { er.textContent = "Not sent: " + m; er.hidden = false; }
      drawThread();
    } else alert("Not sent: " + m);
  }
  sendingNow[id] = false;
  const sb1 = $("sendBtn"), tb1 = $("replyText"); if (sb1 && tb1) sb1.disabled = !tb1.value.trim();
}

/* ---------- check this ---------- */
// Plain words for why an email is in this list.
function reviewReason(r) {
  const x = String(r || "").toLowerCase();
  if (/question before booking/.test(x)) return "A guest asked a question before booking. Answer it in Booking.com.";
  if (/unknown email from booking\.com/.test(x)) return "Booking.com sent an email we do not recognise. Have a look in Gmail.";
  if (/unknown sender/.test(x)) return "An email from someone we do not recognise. Have a look in Gmail.";
  if (/could not be read|unreadable|text could not/.test(x)) return "A guest message we could not read. Open the chat in Booking.com.";
  if (/without a booking number/.test(x)) return "A message without a booking number. Check it in Booking.com.";
  if (/date missing|unreadable date/.test(x)) return "An email we could not date. Have a look in Gmail.";
  const t = String(r || "Something we could not sort");
  return t.charAt(0).toUpperCase() + t.slice(1) + ". Have a look in Gmail.";
}

async function markHandled(id, btn) {
  if (btn) btn.disabled = true;
  try { await reviewHandledFn({ id }); }       // the list updates by itself when the server saves it
  catch (e) { alert("Could not save (" + ((e && e.message) || "error") + ")."); if (btn) btn.disabled = false; }
}

function renderReview() {
  $("chatPane").dataset.conv = "";
  const items = [...reviewItems].sort((a, b) => (toDate(b.date)?.getTime() || 0) - (toDate(a.date)?.getTime() || 0));
  const body = reviewError ? `<div class="err">${esc(reviewError)}</div>`
    : !loaded.review ? `<div class="msg">Loading...</div>`
    : !items.length ? `<div class="empty">Nothing to look at.</div>`
    : `<div class="list">${items.map(i => `<div class="rv"><div class="rv__reason">${esc(reviewReason(i.reason))}</div>
        <div class="rv__meta">${esc(toDate(i.date) ? fmtDay(toDate(i.date)) + ", " + fmtClock(toDate(i.date)) : "")}</div>
        <div class="rv__meta">${esc(i.subject || "")}</div>
        <div class="rv__btns">${i.link ? `<a class="btn" href="${esc(i.link)}" target="_blank" rel="noopener">${icon("out")}Open in Booking.com</a>` : ""}
          <button class="btn" type="button" data-handled="${esc(i.id)}">${icon("check")}Handled</button></div></div>`).join("")}</div>`;
  $("chatPane").innerHTML = `<div class="head"><div class="head__row"><button class="iconbtn only-narrow" id="backBtn" type="button" aria-label="Back to the list">${icon("back")}Inbox</button>
    <div class="head__name">Other Booking.com emails (${reviewItems.length})</div></div></div>
    <div class="pane__scroll">${body}</div>`;
  $("backBtn").onclick = goBackToList;
  $("chatPane").querySelectorAll("[data-handled]").forEach(b => b.onclick = () => markHandled(b.dataset.handled, b));
}

/* ---------- data + sign-in (owner's Google account only, same as the pricing pages) ---------- */
let started = false;
function start() {
  if (started) return;
  started = true;
  $("app").style.display = "flex";
  const fail = e => { loadError = "Could not read the inbox (" + (e.code || e.message) + "). If this says permission-denied, the Firestore rules are not published."; render(); };
  onSnapshot(collection(db, "inbox_conversations"),
    s => { convs = s.docs.map(d => ({ id: d.id, ...d.data() })); loaded.convs = true; loadError = ""; render(); }, fail);
  onSnapshot(collection(db, "inbox_review"),
    s => { reviewItems = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(i => !i.resolved); loaded.review = true; reviewError = ""; render(); },
    e => { reviewError = "Could not load the other Booking.com emails (" + (e.code || e.message) + ")."; if (route().page === "review") renderReview(); });
  // The AI mode (Off / Drafts / Automatic) is set in the admin and saved in globals/config.
  onSnapshot(doc(db, "globals", "config"), snap => {
    const c = snap.exists() ? snap.data() : {};
    aiMode = ["off", "drafts", "auto"].includes(c.bookingAiMode) ? c.bookingAiMode : (c.bookingAiDraftsEnabled === false ? "off" : "drafts");
    paintAiChip();
    if (route().page === "conv") { const cv = convs.find(x => x.id === route().id); if (cv) { $("draftSlot") && ($("draftSlot").dataset.key = ""); drawDraft(cv); } }
  }, () => { aiMode = null; paintAiChip(); });
  // Who is here: one small record per conversation. Needs a Firestore rule (docs/INBOX_PLAN.md); without it this stays hidden.
  onSnapshot(collection(db, "inbox_presence"),
    s => { presenceAll = {}; s.docs.forEach(d => { presenceAll[d.id] = d.data(); }); paintPresence(); if (route().page !== "conv" || isNarrow() === false) renderList(route()); },
    () => { presenceOk = false; presenceAll = {}; paintPresence(); });
  render();
  setInterval(() => { if (started && !loadError && route().page !== "conv") renderList(route()); }, 60000);   // keeps "waiting 2 h" current
  if (alertsSupported() && Notification.permission === "granted") checkAlertsStatus();
}
// Stay signed in on this phone or computer: the sign-in is kept in the browser's local storage until I sign out.
try { await setPersistence(auth, browserLocalPersistence); } catch (e) { /* the default (also kept) is fine */ }
window.addEventListener("message", ev => {
  if (!EMBED || ev.origin !== location.origin || ev.source !== window.parent || !ev.data || ev.data.source !== "maxela-admin") return;
  if (ev.data.type === "open" && ev.data.c) go("c/" + encodeURIComponent(String(ev.data.c)));
  if (ev.data.type === "list") go("");
  if (ev.data.type === "view" && ev.data.view === "ai") go("ai");
});
requireInboxUser({ auth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }, { onReady: user => { me = inboxUserFor(user && user.email); if (SIGNIN_RETURN) { location.replace("/checkin-admin?tab=inbox"); return; } tellAdmin({ type: "ready" }); start(); } });
</script>
