name: "WhatsApp: Check-in Reminder"

on:
  repository_dispatch:
    types: [whatsapp_checkin_reminder]
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests "firebase-admin==6.9.0"

      - name: Run checkin reminder
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          META_WABA_ID: ${{ secrets.META_WABA_ID }}
        run: python3 whatsapp_automation.py --job checkin_reminder
