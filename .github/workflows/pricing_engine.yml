name: Maxela Pricing Engine

on:
  workflow_dispatch:
    inputs:
      urgent:
        description: 'Urgent cancellation reprice (true/false)'
        required: false
        default: 'false'
      property_types:
        description: 'Comma-separated property types to reprice (ROOMS,MAXELA,...)'
        required: false
        default: ''
      dates:
        description: 'Comma-separated cancellation dates (YYYY-MM-DD)'
        required: false
        default: ''

concurrency:
  group: pricing-engine
  cancel-in-progress: false

jobs:
  pricing:
    # The old engine prices no rooms any more. A cancellation (urgent) run goes straight to the new engine.
    if: ${{ github.event.inputs.urgent != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests firebase-admin anthropic

      - name: Run pricing engine
        env:
          MINIHOTEL_HOTEL:          ${{ secrets.MINIHOTEL_HOTEL }}
          MINIHOTEL_USER:           ${{ secrets.MINIHOTEL_USER }}
          MINIHOTEL_PASS:           ${{ secrets.MINIHOTEL_PASS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SERPAPI_KEY:              ${{ secrets.SERPAPI_KEY }}
          SENDGRID_KEY:             ${{ secrets.SENDGRID_KEY }}
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          PRICING_URGENT:           ${{ github.event.inputs.urgent }}
          PRICING_PROPERTIES:       ${{ github.event.inputs.property_types }}
          PRICING_DATES:            ${{ github.event.inputs.dates }}
        run: python pricing_engine.py --apply

  shadow:
    needs: pricing
    if: ${{ always() && github.event.inputs.urgent != 'true' }}
    concurrency:
      group: pricing-shadow
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests firebase-admin
      - name: Shadow run of the new engine (reads only)
        env:
          MINIHOTEL_HOTEL:          ${{ secrets.MINIHOTEL_HOTEL }}
          MINIHOTEL_USER:           ${{ secrets.MINIHOTEL_USER }}
          MINIHOTEL_PASS:           ${{ secrets.MINIHOTEL_PASS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python pricing_shadow.py

  calm_live:
    needs: pricing
    # also for a cancellation run (urgent=true): then only the named rooms and nights are looked at
    if: ${{ always() }}
    concurrency:
      group: pricing-calm-live
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests firebase-admin
      - name: New engine, all live room types (all 10 rooms)
        env:
          MINIHOTEL_HOTEL:          ${{ secrets.MINIHOTEL_HOTEL }}
          MINIHOTEL_USER:           ${{ secrets.MINIHOTEL_USER }}
          MINIHOTEL_PASS:           ${{ secrets.MINIHOTEL_PASS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PRICING_URGENT:           ${{ github.event.inputs.urgent }}
          PRICING_PROPERTIES:       ${{ github.event.inputs.property_types }}
          PRICING_DATES:            ${{ github.event.inputs.dates }}
        run: python pricing_calm_live.py

  watchdog:
    needs: calm_live
    if: ${{ always() && github.event.inputs.urgent != 'true' }}
    concurrency:
      group: pricing-watchdog
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests firebase-admin
      - name: Price watchdog (reads the run, saves the card, WhatsApp only when red)
        env:
          MINIHOTEL_HOTEL:          ${{ secrets.MINIHOTEL_HOTEL }}
          MINIHOTEL_USER:           ${{ secrets.MINIHOTEL_USER }}
          MINIHOTEL_PASS:           ${{ secrets.MINIHOTEL_PASS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          META_ACCESS_TOKEN:        ${{ secrets.META_ACCESS_TOKEN }}
          META_PHONE_NUMBER_ID:     ${{ secrets.META_PHONE_NUMBER_ID }}
        run: python scripts/price_watchdog.py

  after_run:
    # The twin (every run), then what is due: nightly (history log, scorecard) and weekly (review bots). Sends nothing to channels.
    needs: calm_live
    if: ${{ always() && github.event.inputs.urgent != 'true' }}
    concurrency:
      group: pricing-after-run
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests firebase-admin google-cloud-storage anthropic
      - name: Twin, nightly and weekly tasks
        env:
          MINIHOTEL_HOTEL:          ${{ secrets.MINIHOTEL_HOTEL }}
          MINIHOTEL_USER:           ${{ secrets.MINIHOTEL_USER }}
          MINIHOTEL_PASS:           ${{ secrets.MINIHOTEL_PASS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          META_ACCESS_TOKEN:        ${{ secrets.META_ACCESS_TOKEN }}
          META_PHONE_NUMBER_ID:     ${{ secrets.META_PHONE_NUMBER_ID }}
        run: python scripts/after_run.py
