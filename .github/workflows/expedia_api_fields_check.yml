name: Expedia API fields check (temporary)

on:
  push:
    branches:
      - claude/expedia-fraud-detection-l38nq4

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 "firebase-admin==6.5.0" "google-cloud-firestore==2.13.1" cryptography
      - name: Run read-only field check
        env:
          MINIHOTEL_HOTEL: ${{ secrets.MINIHOTEL_HOTEL }}
          MINIHOTEL_USER:  ${{ secrets.MINIHOTEL_USER }}
          MINIHOTEL_PASS:  ${{ secrets.MINIHOTEL_PASS }}
        run: python scripts/expedia_api_fields_check.py
