name: Pipeline functions tests

on:
  push:
    branches: [main]
    paths:
      - 'pipeline-functions/**'
      - 'shared/guest-unlock.js'
      - 'scripts/check-guest-unlock-sync.js'
      - '.github/workflows/pipeline-functions-test.yml'
  pull_request:
    paths:
      - 'pipeline-functions/**'
      - 'shared/guest-unlock.js'
      - 'scripts/check-guest-unlock-sync.js'
      - '.github/workflows/pipeline-functions-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline-functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pipeline-functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Guest unlock sync check
        working-directory: .
        run: node scripts/check-guest-unlock-sync.js
