name: Secrets check (names only)

# Manual. Prints only whether each secret / setting is set. Never prints a value.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install firebase-admin
      - name: Check
        env:
          META_ACCESS_TOKEN:        ${{ secrets.META_ACCESS_TOKEN }}
          META_PHONE_NUMBER_ID:     ${{ secrets.META_PHONE_NUMBER_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          for n in META_ACCESS_TOKEN META_PHONE_NUMBER_ID FIREBASE_SERVICE_ACCOUNT; do
            if [ -n "${!n}" ]; then echo "$n: set"; else echo "$n: MISSING"; fi
          done
          python - <<'PY'
          import os, json, base64, firebase_admin
          from firebase_admin import credentials, firestore
          firebase_admin.initialize_app(credentials.Certificate(json.loads(base64.b64decode(os.environ["FIREBASE_SERVICE_ACCOUNT"]))))
          s = firestore.client().collection("globals").document("config").get()
          v = (s.to_dict() or {}).get("ownerPhone") if s.exists else None
          digits = "".join(c for c in str(v or "") if c.isdigit())
          print("globals/config.ownerPhone:", "set (%d digits)" % len(digits) if digits else "MISSING")
          PY
