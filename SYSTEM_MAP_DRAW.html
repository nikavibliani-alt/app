<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxela — Your system map (blank board)</title>
<style>
  :root{
    --bg:#eceef1; --panel:#fff; --ink:#1a1d23; --muted:#6b7280;
    --line:#e2e5ea; --accent:#2563eb; --accent-soft:#eff6ff;
    --ok:#15803d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}

  header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;
  }
  header h1{font-size:16px;font-weight:700}
  header p{font-size:11px;color:var(--muted);margin-top:2px}
  .hdr-btns{display:flex;flex-wrap:wrap;gap:6px}
  .hdr-btns button{
    font:inherit;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;
    border:1px solid var(--line);background:#fff;cursor:pointer;
  }
  .hdr-btns button:hover{background:#f8f9fa}
  .hdr-btns button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .body{flex:1;display:flex;min-height:0}

  .tools{
    width:48px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;flex-shrink:0;
  }
  .tools button{
    width:38px;height:38px;border:none;border-radius:9px;background:transparent;
    font-size:17px;cursor:pointer;color:var(--ink);
  }
  .tools button:hover{background:#f3f4f6}
  .tools button.active{background:var(--accent-soft);color:var(--accent);outline:2px solid #bfdbfe}
  .tools .sep{height:1px;width:28px;background:var(--line);margin:6px 0}

  .canvas-wrap{flex:1;position:relative;overflow:hidden;background:#fafafa}
  .canvas-wrap.hand{cursor:grab}
  .canvas-wrap.hand.grabbing,.canvas-wrap.space-pan{cursor:grabbing}
  .canvas-wrap.pen{cursor:crosshair}
  .canvas-wrap.box,.canvas-wrap.text{cursor:crosshair}
  svg{display:block;width:100%;height:100%;touch-action:none}
  .shape{fill:#fff;stroke:var(--ink);stroke-width:2;cursor:move}
  .shape-text{fill:var(--ink);font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:middle;pointer-events:none;user-select:none}
  .stroke{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .arrow{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#arr)}
  .label{fill:var(--ink);font-size:15px;font-weight:500;cursor:move;user-select:none}
  .sel{stroke:var(--accent)!important;stroke-width:3!important}
  .ghost{fill:rgba(37,99,235,.06);stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}

  .panel{
    width:260px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0;transition:width .2s,margin .2s;
  }
  .panel.hidden{width:0;border:none;overflow:hidden}
  .panel-head{padding:12px 14px;border-bottom:1px solid var(--line)}
  .panel-head h2{font-size:13px;font-weight:700}
  .panel-head p{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
  .panel-body{flex:1;overflow-y:auto;padding:10px 12px}
  .group{margin-bottom:14px}
  .group-title{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .check{
    display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:8px;
    font-size:12.5px;line-height:1.35;cursor:pointer;margin-bottom:2px;
  }
  .check:hover{background:#f8f9fa}
  .check input{margin-top:2px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
  .check.done{color:var(--ok)}
  .check.done span{text-decoration:line-through;opacity:.75}
  .progress{font-size:11px;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line)}

  .hint{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    background:rgba(26,29,35,.88);color:#fff;font-size:12px;padding:8px 14px;border-radius:999px;
    pointer-events:none;white-space:nowrap;z-index:5;transition:opacity .4s;
  }
  .hint.fade{opacity:0}

  .text-editor{
    position:absolute;z-index:20;min-width:120px;max-width:280px;
    font:inherit;font-size:14px;font-weight:500;padding:6px 8px;border-radius:8px;
    border:2px solid var(--accent);background:#fff;outline:none;resize:none;
    box-shadow:0 4px 16px rgba(0,0,0,.12);
  }

  @media(max-width:800px){
    .panel{position:absolute;right:0;top:0;bottom:0;z-index:10;box-shadow:-4px 0 20px rgba(0,0,0,.08)}
    .panel.hidden{width:0}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Your system map</h1>
    <p>Start on an empty board · roam freely · or open the <a href="SYSTEM_MAP_BEGINNER_VISUAL.html" style="color:#2563eb">pre-drawn beginner map</a></p>
  </div>
  <div class="hdr-btns">
    <button type="button" id="btn-checklist" class="on">Checklist</button>
    <button type="button" id="btn-save">Save</button>
    <button type="button" id="btn-clear">Clear board</button>
  </div>
</header>

<div class="body">
  <aside class="tools" aria-label="Tools">
    <button type="button" class="active" data-t="hand" title="Move / pan (default)">✋</button>
    <button type="button" data-t="select" title="Select item">↖</button>
    <div class="sep"></div>
    <button type="button" data-t="pen" title="Pen — drag to draw">✎</button>
    <button type="button" data-t="box" title="Box — drag to draw">▢</button>
    <button type="button" data-t="arrow" title="Arrow — 2 clicks">→</button>
    <button type="button" data-t="text" title="Text — drag a box, then type">T</button>
    <div class="sep"></div>
    <button type="button" data-t="erase" title="Delete — click item">⌫</button>
  </aside>

  <div class="canvas-wrap hand" id="wrap">
    <svg id="svg" viewBox="0 0 4000 3000">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#1a1d23"/>
        </marker>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eceef1" stroke-width="1"/>
        </pattern>
      </defs>
      <g id="cam">
        <rect width="4000" height="3000" fill="url(#grid)"/>
        <g id="draw"></g>
        <g id="ghost"></g>
      </g>
    </svg>
    <div class="hint" id="hint">✋ Drag to move around · scroll to zoom · nothing is created until you choose a draw tool</div>
  </div>

  <aside class="panel" id="panel">
    <div class="panel-head">
      <h2>What am I missing?</h2>
      <p>Beginner checklist only. Tick items as you add them — nothing is drawn for you.</p>
    </div>
    <div class="panel-body" id="checks"></div>
    <div class="progress" id="prog">0 / 0 checked</div>
  </aside>
</div>

<script>
(() => {
  const KEY = 'maxela_blank_map_v3';
  const DRAG_START = 10;   // px before a draw gesture starts
  const MIN_BOX = 28;      // min box size

  const wrap = document.getElementById('wrap');
  const svg = document.getElementById('svg');
  const cam = document.getElementById('cam');
  const draw = document.getElementById('draw');
  const ghost = document.getElementById('ghost');
  const hint = document.getElementById('hint');
  const checksEl = document.getElementById('checks');
  const prog = document.getElementById('prog');

  const CHECKLIST = [
    { group:'Guest', items:[
      'Booking arrives (MiniHotel)',
      'Guest opens check-in page',
      'Guest registers',
      'Guest gets unlock (door / WiFi)',
    ]},
    { group:'Admin', items:[
      'See today’s guests',
      'Check passport / grant access',
      'Edit apartment info',
    ]},
    { group:'Housekeeping', items:[
      'HK marks room clean',
      'Early unlock when room ready',
    ]},
    { group:'Where data lives', items:[
      'Bookings (reservations)',
      'Guest forms (checkin_guests)',
      'Room info (checkin_apartments)',
    ]},
  ];

  let tool = 'hand';
  let camX = 200, camY = 150, camS = 1;
  let selected = null;
  let dragItem = null;
  let panning = null;
  let spaceDown = false;
  let pointerDown = null;
  let boxDrag = null;
  let penPath = null;
  let penD = '';
  let arrowA = null;
  let idN = 0;
  let activeEditor = null;

  const hints = {
    hand:'✋ Drag to pan · scroll to zoom · hold Space to pan from any tool',
    select:'↖ Click an item to select · drag empty space to pan',
    pen:'✎ Drag to draw — a plain click does nothing',
    box:'▢ Drag to draw a box — a plain click does nothing',
    arrow:'→ Click start point, then end point',
    text:'T Drag a text box, then type — a plain click does nothing',
    erase:'⌫ Click an item to delete it',
  };

  function applyCam(){
    cam.setAttribute('transform', `translate(${camX},${camY}) scale(${camS})`);
  }

  function pt(ex, ey){
    const p = svg.createSVGPoint();
    p.x = ex; p.y = ey;
    return p.matrixTransform(cam.getScreenCTM().inverse());
  }

  function screenFromWorld(x, y){
    const p = svg.createSVGPoint();
    p.x = x; p.y = y;
    const s = p.matrixTransform(cam.getScreenCTM());
    const r = wrap.getBoundingClientRect();
    return { left: s.x - r.left, top: s.y - r.top };
  }

  function setTool(t){
    closeEditor(false);
    tool = t;
    document.querySelectorAll('.tools button[data-t]').forEach(b=>{
      b.classList.toggle('active', b.dataset.t===t);
    });
    wrap.className = 'canvas-wrap ' + (t==='hand'||t==='select'? 'hand' : t);
    hint.textContent = hints[t]||'';
    hint.classList.remove('fade');
    arrowA = null;
    ghost.innerHTML = '';
    if(t!=='select') deselect();
  }

  function nid(){ return 'n'+(++idN); }

  function deselect(){
    if(selected){ selected.classList.remove('sel'); selected = null; }
  }

  function select(el){
    deselect();
    selected = el;
    if(el) el.classList.add('sel');
  }

  function isDrawn(el){ return draw.contains(el); }

  function dist(a, b){
    return Math.hypot(b.x - a.x, b.y - a.y);
  }

  function closeEditor(save){
    if(!activeEditor) return;
    const { el, ta, kind, box } = activeEditor;
    const text = ta.value.trim();
    if(save && text){
      if(kind === 'text'){
        el.textContent = text;
      } else {
        el.querySelector('text').textContent = text;
      }
    } else if(kind === 'text'){
      el.remove();
    } else if(!text){
      el.querySelector('text').textContent = 'label';
    }
    ta.remove();
    activeEditor = null;
  }

  function openEditor(kind, el, box){
    closeEditor(true);
    const pos = screenFromWorld(box.x, box.y);
    const ta = document.createElement('textarea');
    ta.className = 'text-editor';
    ta.rows = Math.max(2, Math.ceil(box.h / 18));
    ta.style.left = pos.left + 'px';
    ta.style.top = pos.top + 'px';
    ta.style.width = Math.max(120, box.w * camS) + 'px';
    ta.style.minHeight = Math.max(36, box.h * camS) + 'px';
    ta.value = kind === 'text' ? '' : (el.querySelector?.('text')?.textContent || '');
    if(kind === 'text' && !ta.value) ta.placeholder = 'Type here…';
    wrap.appendChild(ta);
    ta.focus();
    activeEditor = { el, ta, kind, box };
    ta.addEventListener('keydown', e=>{
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        closeEditor(true);
      }
      if(e.key === 'Escape') closeEditor(false);
    });
    ta.addEventListener('blur', ()=> closeEditor(true));
  }

  function wire(el){
    el.addEventListener('pointerdown', e=>{
      if(tool==='erase' && isDrawn(el)){
        el.remove();
        if(selected===el) selected=null;
        e.stopPropagation();
        return;
      }
      if(tool!=='select') return;
      e.stopPropagation();
      select(el);
      const p = pt(e.clientX, e.clientY);
      let ox, oy;
      if(el.tagName==='g'){
        const tr = el.getAttribute('transform')||'translate(0,0)';
        const m = tr.match(/translate\(([-\d.]+),\s*([-\d.]+)\)/);
        ox=+(m?.[1]||0); oy=+(m?.[2]||0);
        dragItem = {el, sx:p.x, sy:p.y, ox, oy, kind:'g'};
      } else {
        ox=+el.getAttribute('x')||0; oy=+el.getAttribute('y')||0;
        dragItem = {el, sx:p.x, sy:p.y, ox, oy, kind:'t'};
      }
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('dblclick', e=>{
      e.stopPropagation();
      if(el.dataset.kind==='box'){
        const tr = el.getAttribute('transform').match(/translate\(([-\d.]+),\s*([-\d.]+)\)/);
        const r = el.querySelector('rect');
        openEditor('box', el, {
          x:+tr[1], y:+tr[2],
          w:+r.getAttribute('width'), h:+r.getAttribute('height'),
        });
      } else if(el.dataset.kind==='text'){
        openEditor('text', el, {
          x:+el.getAttribute('x'), y:+el.getAttribute('y') - 14,
          w:160, h:32,
        });
      }
    });
  }

  function addBox(x,y,w,h,text='label'){
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.dataset.kind = 'box';
    g.dataset.id = nid();
    g.setAttribute('transform', `translate(${x},${y})`);
    const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('class','shape');
    r.setAttribute('width', Math.max(MIN_BOX,w));
    r.setAttribute('height', Math.max(MIN_BOX,h));
    r.setAttribute('rx','8');
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('class','shape-text');
    t.setAttribute('x', Math.max(MIN_BOX,w)/2);
    t.setAttribute('y', Math.max(MIN_BOX,h)/2);
    t.textContent = text;
    g.append(r,t);
    wire(g);
    draw.appendChild(g);
    return g;
  }

  function addText(x,y, text=''){
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.dataset.kind = 'text';
    t.dataset.id = nid();
    t.setAttribute('class','label');
    t.setAttribute('x', x);
    t.setAttribute('y', y);
    t.textContent = text;
    wire(t);
    draw.appendChild(t);
    return t;
  }

  function addArrow(x1,y1,x2,y2){
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.dataset.kind = 'arrow';
    p.dataset.id = nid();
    p.setAttribute('class','arrow');
    const mx = (x1+x2)/2;
    p.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    wire(p);
    draw.appendChild(p);
    return p;
  }

  function addPen(d){
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.dataset.kind = 'pen';
    p.dataset.id = nid();
    p.setAttribute('class','stroke');
    p.setAttribute('d', d);
    wire(p);
    draw.appendChild(p);
    return p;
  }

  function buildChecklist(){
    checksEl.innerHTML = '';
    CHECKLIST.forEach(gr=>{
      const div = document.createElement('div');
      div.className = 'group';
      div.innerHTML = `<div class="group-title">${gr.group}</div>`;
      gr.items.forEach((label,i)=>{
        const id = gr.group+'_'+i;
        const row = document.createElement('label');
        row.className = 'check';
        row.innerHTML = `<input type="checkbox" data-id="${id}"><span>${label}</span>`;
        row.querySelector('input').addEventListener('change', updateProg);
        div.appendChild(row);
      });
      checksEl.appendChild(div);
    });
    updateProg();
  }

  function updateProg(){
    const all = checksEl.querySelectorAll('input[type=checkbox]');
    const done = checksEl.querySelectorAll('input:checked');
    all.forEach(inp=>{
      inp.closest('.check').classList.toggle('done', inp.checked);
    });
    prog.textContent = `${done.length} / ${all.length} checked`;
  }

  function save(){
    closeEditor(true);
    const items = [];
    draw.querySelectorAll('[data-kind]').forEach(el=>{
      const k = el.dataset.kind;
      if(k==='box'){
        const tr = el.getAttribute('transform').match(/translate\(([-\d.]+),\s*([-\d.]+)\)/);
        const r = el.querySelector('rect');
        items.push({k,x:+tr[1],y:+tr[2],w:+r.getAttribute('width'),h:+r.getAttribute('height'),text:el.querySelector('text').textContent});
      } else if(k==='text'){
        items.push({k,x:+el.getAttribute('x'),y:+el.getAttribute('y'),text:el.textContent});
      } else if(k==='arrow'||k==='pen'){
        items.push({k,d:el.getAttribute('d')});
      }
    });
    const checked = [...checksEl.querySelectorAll('input:checked')].map(i=>i.dataset.id);
    localStorage.setItem(KEY, JSON.stringify({items, checked, cam:{camX,camY,camS}}));
    hint.textContent = 'Saved ✓';
    hint.classList.remove('fade');
    setTimeout(()=> hint.textContent = hints[tool], 1200);
  }

  function load(){
    const raw = localStorage.getItem(KEY) || localStorage.getItem('maxela_blank_map_v2');
    if(!raw) return;
    try{
      const d = JSON.parse(raw);
      draw.innerHTML = '';
      idN = 0;
      (d.items||[]).forEach(it=>{
        if(it.k==='box') addBox(it.x,it.y,it.w,it.h,it.text);
        else if(it.k==='text') addText(it.x,it.y,it.text);
        else if(it.k==='arrow'){
          const p = document.createElementNS('http://www.w3.org/2000/svg','path');
          p.dataset.kind='arrow'; p.dataset.id=nid();
          p.setAttribute('class','arrow'); p.setAttribute('d',it.d);
          wire(p); draw.appendChild(p);
        } else if(it.k==='pen'){
          const p = document.createElementNS('http://www.w3.org/2000/svg','path');
          p.dataset.kind='pen'; p.dataset.id=nid();
          p.setAttribute('class','stroke'); p.setAttribute('d',it.d);
          wire(p); draw.appendChild(p);
        }
      });
      checksEl.querySelectorAll('input').forEach(inp=>{
        inp.checked = (d.checked||[]).includes(inp.dataset.id);
      });
      updateProg();
      if(d.cam){ camX=d.cam.camX??camX; camY=d.cam.camY??camY; camS=d.cam.camS??camS; applyCam(); }
    }catch(e){}
  }

  function panMode(){
    return tool==='hand' || tool==='select' || spaceDown || (pointerDown && pointerDown.mode==='pan');
  }

  function beginPan(e){
    panning = {sx:e.clientX, sy:e.clientY, cx:camX, cy:camY};
    wrap.classList.add(spaceDown ? 'space-pan' : 'grabbing');
  }

  function cancelGesture(){
    ghost.innerHTML = '';
    boxDrag = null;
    penPath = null;
    penD = '';
    pointerDown = null;
  }

  document.querySelector('.tools').addEventListener('click', e=>{
    const b = e.target.closest('button[data-t]');
    if(b) setTool(b.dataset.t);
  });

  document.getElementById('btn-checklist').addEventListener('click', function(){
    document.getElementById('panel').classList.toggle('hidden');
    this.classList.toggle('on');
  });

  document.getElementById('btn-save').addEventListener('click', save);

  document.getElementById('btn-clear').addEventListener('click', ()=>{
    if(confirm('Clear the whole board?')){
      closeEditor(false);
      draw.innerHTML = '';
      deselect();
    }
  });

  window.addEventListener('keydown', e=>{
    if(e.code === 'Space' && !spaceDown && !e.target.closest('textarea,input')){
      spaceDown = true;
      wrap.classList.add('space-pan');
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e=>{
    if(e.code === 'Space'){
      spaceDown = false;
      wrap.classList.remove('space-pan');
      if(!panning) wrap.classList.remove('grabbing');
    }
  });

  wrap.addEventListener('pointerdown', e=>{
    if(activeEditor && !e.target.classList.contains('text-editor')) closeEditor(true);
    if(e.target.closest('[data-kind]') && tool!=='hand' && !spaceDown) return;

    const p = pt(e.clientX, e.clientY);

    if(panMode() || e.button === 1){
      pointerDown = { sx:e.clientX, sy:e.clientY, p, mode:'pan' };
      beginPan(e);
      wrap.setPointerCapture(e.pointerId);
      return;
    }

    if(tool==='arrow'){
      if(!arrowA){
        arrowA = p;
        ghost.innerHTML = `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#2563eb"/>`;
      } else {
        if(dist(arrowA, p) > 8) addArrow(arrowA.x, arrowA.y, p.x, p.y);
        arrowA = null;
        ghost.innerHTML = '';
      }
      return;
    }

    // drawing tools wait for drag threshold — plain click does nothing
    pointerDown = { sx:e.clientX, sy:e.clientY, p, mode:'draw', tool };
    wrap.setPointerCapture(e.pointerId);
  });

  wrap.addEventListener('pointermove', e=>{
    const p = pt(e.clientX, e.clientY);

    if(dragItem){
      const dx = p.x-dragItem.sx, dy = p.y-dragItem.sy;
      if(dragItem.kind==='g')
        dragItem.el.setAttribute('transform', `translate(${dragItem.ox+dx},${dragItem.oy+dy})`);
      else {
        dragItem.el.setAttribute('x', dragItem.ox+dx);
        dragItem.el.setAttribute('y', dragItem.oy+dy);
      }
      return;
    }

    if(panning){
      camX = panning.cx + (e.clientX - panning.sx);
      camY = panning.cy + (e.clientY - panning.sy);
      applyCam();
      return;
    }

    if(pointerDown && pointerDown.mode==='draw' && !boxDrag && !penPath){
      if(dist(pointerDown.p, p) < DRAG_START) return;
      if(pointerDown.tool==='box' || pointerDown.tool==='text'){
        const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
        r.setAttribute('class','ghost');
        r.setAttribute('x', pointerDown.p.x);
        r.setAttribute('y', pointerDown.p.y);
        r.setAttribute('width',0);
        r.setAttribute('height',0);
        r.setAttribute('rx','8');
        ghost.innerHTML='';
        ghost.appendChild(r);
        boxDrag = {x0:pointerDown.p.x, y0:pointerDown.p.y, rect:r, kind:pointerDown.tool};
      } else if(pointerDown.tool==='pen'){
        penD = `M${pointerDown.p.x},${pointerDown.p.y}`;
        penPath = document.createElementNS('http://www.w3.org/2000/svg','path');
        penPath.setAttribute('class','stroke');
        penPath.setAttribute('d', penD);
        ghost.innerHTML='';
        ghost.appendChild(penPath);
      }
    }

    if(boxDrag && boxDrag.rect){
      const x = Math.min(boxDrag.x0, p.x), y = Math.min(boxDrag.y0, p.y);
      const w = Math.abs(p.x - boxDrag.x0), h = Math.abs(p.y - boxDrag.y0);
      boxDrag.rect.setAttribute('x', x);
      boxDrag.rect.setAttribute('y', y);
      boxDrag.rect.setAttribute('width', w);
      boxDrag.rect.setAttribute('height', h);
      return;
    }

    if(penPath){
      penD += ` L${p.x},${p.y}`;
      penPath.setAttribute('d', penD);
      return;
    }

    if(arrowA){
      const mx = (arrowA.x+p.x)/2;
      ghost.innerHTML = `<circle cx="${arrowA.x}" cy="${arrowA.y}" r="5" fill="#2563eb"/>
        <path class="arrow" opacity=".4" d="M${arrowA.x},${arrowA.y} C${mx},${arrowA.y} ${mx},${p.y} ${p.x},${p.y}"/>`;
    }
  });

  wrap.addEventListener('pointerup', e=>{
    if(dragItem){ dragItem=null; return; }
    if(panning){
      panning=null;
      wrap.classList.remove('grabbing','space-pan');
      pointerDown = null;
      return;
    }

    if(boxDrag && boxDrag.rect){
      const x = +boxDrag.rect.getAttribute('x');
      const y = +boxDrag.rect.getAttribute('y');
      const w = +boxDrag.rect.getAttribute('width');
      const h = +boxDrag.rect.getAttribute('height');
      ghost.innerHTML = '';
      if(w >= MIN_BOX && h >= MIN_BOX){
        if(boxDrag.kind === 'text'){
          const el = addText(x + 8, y + h/2 + 5, '');
          openEditor('text', el, { x, y, w, h });
        } else {
          const el = addBox(x,y,w,h);
          openEditor('box', el, { x, y, w, h });
        }
      }
      boxDrag = null;
      pointerDown = null;
      return;
    }

    if(penPath){
      if(penD.split('L').length > 2) addPen(penD);
      ghost.innerHTML = '';
      penPath = null;
      penD = '';
      pointerDown = null;
      return;
    }

    pointerDown = null;

    if(tool==='select') deselect();
  });

  wrap.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const prev = camS;
    camS = Math.min(2.5, Math.max(0.25, camS * (e.deltaY < 0 ? 1.07 : 0.93)));
    camX = mx - (mx - camX) * (camS / prev);
    camY = my - (my - camY) * (camS / prev);
    applyCam();
  }, {passive:false});

  buildChecklist();
  load();
  applyCam();
  setTool('hand');
  setTimeout(()=> hint.classList.add('fade'), 8000);
})();
</script>
</body>
</html>
