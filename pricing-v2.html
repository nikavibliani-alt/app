<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing, new page - Maxela</title>
<style>
:root{
  --ink:#1F1F1F;--page:#F5F4F2;--card:#FFFFFF;--line:#E6E4E0;--line2:#EFEDE9;--muted:#5A5955;--soft:#3E3D3A;
  --green:#2E6B34;--green-bg:#E3F1DF;--green-ink:#1F4D25;--red:#9B2C2C;--red-bg:#FBE4E4;--red-ink:#7A1F1F;
  --amber-bg:#FFF1D0;--amber-ink:#6B4500;--chip:#E9E7E3;--sel:#F0EEEA;--btn-line:#CFCCC6;--off:#8C8A85;--bar-h:0px;--head-h:64px;
  --bg:#F5F4F2;--card-bg:#FFFFFF;--border:#E6E4E0;--text-main:#1F1F1F;--text-muted:#5A5955;--status-red:#9B2C2C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;font-size:15px}
button{font:inherit;color:var(--ink);background:transparent;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled,[aria-disabled="true"]{cursor:not-allowed}
a{color:var(--ink);text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid #3E3D3A;outline-offset:2px}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.hide,[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex-shrink:0}

/* ---------- shell ---------- */
#app{min-height:100vh}
.page{padding:20px 16px calc(32px + var(--bar-h));display:flex;flex-direction:column;gap:18px;max-width:640px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font-size:28px;font-weight:700}
.tabs{display:flex;gap:2px;padding:4px;background:var(--chip);border-radius:12px}
.tab{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:4px;height:44px;padding:0 5px;white-space:nowrap;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);background:transparent;border:0}
body[data-layout="phone"] .tab{font-size:13px}
.tab[aria-current="page"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:#FFFFFF;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.sec{display:flex;flex-direction:column;gap:10px}
.h2{font-size:17px;font-weight:700}
.sub{margin-top:2px;font-size:13px;color:var(--muted);line-height:1.4}
.banner{border-radius:12px;padding:10px 8px 10px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
.banner.red{background:var(--red);color:#FFFFFF}
.banner.green{background:var(--green-bg);color:var(--green-ink)}
.banner button{min-height:44px;padding:0 14px;border-radius:10px;background:#FFFFFF;color:var(--red);font-weight:700}
.sw{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px 0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14px}
.sw .track{width:44px;height:28px;border-radius:14px;position:relative;display:inline-block;background:var(--green)}
.sw .track::after{content:"";position:absolute;top:3px;left:19px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw[aria-checked="false"] .track{background:var(--off)}
.sw[aria-checked="false"] .track::after{left:3px}
.status{padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.status .l1{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.status .chs{display:flex;gap:14px;flex-wrap:wrap}
.ok{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--green-ink)}
.ok.bad{color:var(--red)}
.warnbox{font-size:13px;color:var(--red-ink);background:var(--red-bg);border-radius:8px;padding:8px 10px}
.link{min-height:44px;padding:0;text-decoration:underline;font-weight:600;font-size:14px;display:inline-flex;align-items:center;color:var(--ink)}
.linkb{align-self:flex-start}

/* ---------- lists and rows ---------- */
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;border-bottom:1px solid var(--line2);width:100%;text-align:left;color:var(--ink)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.row .r{text-align:right}
.row .r b{font-size:15px;font-weight:700;display:block}
.row .r span{font-size:12px;color:var(--muted)}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 4px 10px 16px;min-height:60px;border-bottom:1px solid var(--line2)}
.lrow:last-child{border-bottom:0}
.lrow .grow{flex:1;min-width:0}
.lrow .t{font-size:15px;font-weight:600}
.lrow .s{font-size:13px;color:var(--muted)}
.lrow.pending{background:#FAF9F7}
.x{width:48px;height:48px;color:var(--soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:8px}
.x:hover{background:var(--sel)}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;display:inline-block}
.empty{padding:16px;font-size:14px;color:var(--muted)}

/* ---------- controls ---------- */
.btn{height:52px;border-radius:12px;font-weight:600;font-size:15px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.dark{background:var(--ink);color:#FFFFFF}
.btn.light{background:#FFFFFF;color:var(--ink);border:1px solid var(--btn-line)}
.btn.red{background:var(--red);color:#FFFFFF}
.btn.off,.btn[aria-disabled="true"]{background:#E3E1DC;color:#6B6964}
.btn.small{height:44px;border-radius:10px;font-size:14px}
.btn.full{width:100%}
.seg{display:grid;gap:4px;padding:4px;background:var(--chip);border-radius:12px}
.segb{height:44px;border-radius:9px;font-size:14px;font-weight:500;color:var(--soft);background:transparent;padding:0 6px}
.segb.on{background:var(--ink);color:#FFFFFF;font-weight:600}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px 16px;min-height:60px;text-align:left;color:var(--ink);background:transparent}
.opt .rad{width:22px;height:22px;margin-top:1px;border-radius:50%;border:2px solid var(--off);flex-shrink:0}
.opt[aria-checked="true"] .rad{border:7px solid var(--ink)}
.opt .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.opt .tx b{font-size:15px;font-weight:600}
.opt .tx span{font-size:13px;color:var(--muted)}
.opt[aria-disabled="true"]{color:#6B6964}
.opt[aria-disabled="true"] .rad{border-color:#C9C7C2}
.optrow{display:flex;align-items:center;border-bottom:1px solid var(--line2)}
.optrow:last-child{border-bottom:0}
.optrow.on{background:var(--sel)}
.ibtn{width:48px;height:48px;color:var(--soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tag{font-size:12px;font-weight:600;color:var(--muted)}
.beta{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;border:1px solid var(--btn-line);background:#FFFFFF;color:var(--soft);font-size:12px;font-weight:600;vertical-align:middle}
.verdict{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;margin-right:6px}
.verdict.right{background:var(--green-bg);color:var(--green-ink)}.verdict.wrong{background:var(--red-bg);color:var(--red-ink)}.verdict.unclear{background:var(--amber-bg);color:var(--amber-ink)}.verdict.run{background:var(--chip);color:var(--soft)}

.seg{display:flex;gap:4px;padding:4px;background:var(--chip);border-radius:12px}
.cnav{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px}
.slists{display:flex;flex-direction:column;gap:6px}
.slist{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#FFFFFF;color:var(--ink);font-size:15px;text-align:left}
.slist.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.slist .sw{width:22px;height:22px;border-radius:6px;flex:0 0 auto}
.myear{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mm{display:flex;flex-direction:column;gap:5px;padding:8px;border-radius:12px;border:1px solid var(--line);background:#FFFFFF;color:var(--ink);text-align:left;min-height:44px}
.mm b{font-size:13px}
.mgd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mc{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:3px;font-size:12px;font-style:normal;font-weight:700;color:var(--red);background:#FFFFFF;border:1px solid transparent;line-height:1}
.mc.off{background:transparent}
.mc.pre{background:#1F1F1F}
.mc.dim{background:#F0EEEA;color:transparent}
.cm{min-width:0}
.cmh{font-size:15px;font-weight:700;margin-bottom:6px}
.cwk,.cgd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cwk span{font-size:12px;font-weight:600;color:var(--soft);text-align:center;padding-bottom:2px}
.cd{height:34px;border-radius:7px;border:0;color:var(--ink);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;background:#FFFFFF;padding:0;position:relative}
.cm.big .cd{height:48px;font-size:15px;border-radius:9px}
.cd.off{background:transparent}
.cd.un{background:#FFFFFF;border:1px solid var(--btn-line)}
.cd.dim{color:#8C8A85}
.cd.pre{background:#1F1F1F;color:#FFFFFF}
.cd .bang{position:absolute;top:1px;right:3px;font-size:12px;font-style:normal;font-weight:700;color:var(--red)}
.cd.pre .bang{color:#FFFFFF}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.cyear{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 14px}
.sside{display:flex;flex-direction:column;gap:12px;position:sticky;top:80px}
.hint{margin:0;font-size:15px;color:var(--soft)}
.cbox{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:#FFFFFF;border:1px solid var(--line)}
.cbtns{display:flex;flex-direction:column;gap:8px}
.cbtns.row{flex-direction:row;flex-wrap:wrap}
.sbtn{min-height:44px;padding:0 14px;border-radius:10px;border:0;color:var(--ink);font-weight:600;font-size:15px}
.sbtn.un{background:#FFFFFF;border:1px solid var(--btn-line)}
.linkb{align-self:flex-start;min-height:44px;padding:0 4px;background:transparent;border:0;color:var(--ink);font-size:15px;font-weight:600;text-decoration:underline}
.unwarn{padding:10px 14px;border-radius:10px;background:var(--amber-bg);border:1px solid #C9A86A;color:var(--amber-ink);font-size:14px;line-height:1.45}
.unchip{font-size:13px;font-weight:600;color:var(--amber-ink)}
.fold{display:flex;align-items:center;gap:12px}
.fold .grow{flex:1;min-width:0}
.foldb{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--btn-line);background:#FFFFFF;color:var(--ink);font-size:26px;font-weight:600;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.foldb[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.rangeerr{padding:10px 14px;border-radius:10px;background:var(--red-bg);border:1px solid var(--red);color:var(--red-ink);font-size:14px;line-height:1.45}
.impact li{margin:0 0 8px 0}
.scorebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.scorebar b{font-size:16px}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;background:#FFFFFF;color:var(--ink);border:1px solid var(--btn-line)}
.pill[aria-checked="true"],.pill[aria-pressed="true"]{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.pill .pd{width:9px;height:9px;border-radius:50%;display:inline-block}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.num{width:100%;height:44px;padding:0 8px;border:1px solid var(--btn-line);border-radius:10px;font:600 16px system-ui,sans-serif;color:var(--ink);background:#FFFFFF;text-align:center}
.hgrid{display:grid;grid-template-columns:72px repeat(3,minmax(0,1fr));gap:8px 6px;align-items:center}
.hgrid .hch{font-size:12px;font-weight:600;color:var(--soft);text-align:center;line-height:1.25}
.hgrid .hrl{font-size:13px;font-weight:600;line-height:1.25}
.hgrid .num{padding:0 2px}
.wlist{margin:0;padding-left:18px;font-size:14px;line-height:1.5}
.num.bad{border:2px solid var(--red);color:var(--red)}
.num:disabled{background:var(--sel);color:var(--off)}
.cell2{padding:10px 12px;font-size:14px}
.lab{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.fld{width:100%;height:44px;border:1px solid var(--btn-line);border-radius:10px;padding:0 10px;font:16px system-ui,sans-serif;color:var(--ink);background:#FFFFFF}

/* ---------- save bar, toast, dialogs ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#FFFFFF;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06);padding:12px 16px 18px}
#bar .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#bar .msg{font-size:14px}
#bar .msg .n{font-size:13px;color:var(--muted)}
#bar .msg .n.bad{color:var(--red)}
#bar .btns{display:flex;gap:10px}
#bar .btns .btn{flex:1}
#bar .btns .btn.dark,#bar .btns .btn.off{flex:2}
#bar.done{background:var(--green-bg);border-top-color:var(--green-bg)}
#bar.done .msg{color:var(--green-ink);font-weight:600}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + var(--bar-h));z-index:70;max-width:608px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:#FFFFFF;border-radius:12px;padding:4px 6px 4px 16px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast button{min-height:44px;padding:0 14px;color:#FFFFFF;font-weight:700;text-decoration:underline}
#overlay{position:fixed;inset:0;z-index:100;background:rgba(20,20,18,.45);display:flex;align-items:flex-end;justify-content:center}
.dlg{background:#FFFFFF;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:10px 20px 24px;display:flex;flex-direction:column;gap:12px}
.dlg .grab{width:40px;height:4px;border-radius:2px;background:var(--btn-line);align-self:center}
.dlg .dh{display:flex;align-items:center;justify-content:space-between}
.dlg h3{font-size:20px;font-weight:700}
.dlg p{font-size:15px;line-height:1.45}
.dlg ul{margin:0;padding-left:18px;font-size:14px;line-height:1.5}
.dlg .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dlg .tiles div{background:var(--page);border-radius:12px;padding:10px 12px}
.dlg .tiles .k{font-size:12px;font-weight:600;color:var(--soft)}
.dlg .tiles .v{font-size:18px;font-weight:700}
.dlg .tiles .u{font-size:12px;color:var(--soft)}
.dlg figure{margin:0;background:var(--page);border-radius:12px;padding:12px 12px 10px}
.dlg figcaption{font-size:13px;font-weight:600;color:var(--soft);margin-bottom:6px}
.dlg .fine{font-size:13px;color:var(--soft);line-height:1.45}
.steps{margin:0;padding:0;list-style:none}
.steps li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.steps li b{white-space:nowrap}

/* ---------- seasons ---------- */
.card.pad{padding:14px 16px}
.pgrid{display:grid;grid-template-columns:70px repeat(3,minmax(0,1fr));gap:8px;align-items:center}
.rline{display:flex;align-items:center;gap:10px;font-size:15px}
.errline{font-size:13px;font-weight:600;color:var(--red)}
.warnline{font-size:13px;color:var(--soft);background:var(--sel);border-radius:8px;padding:8px 10px}

/* ---------- nights, tiles ---------- */
.night{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;border-bottom:1px solid var(--line2);background:#FFFFFF;color:var(--ink);text-align:left}
.night:last-child{border-bottom:0}
.night .d{width:92px;font-size:14px;font-weight:600}
.night .w{flex:1;font-size:14px;color:var(--soft)}
.night .w.bk{color:var(--green)}
.night .pr{display:flex;flex-direction:column;align-items:flex-end;min-width:64px;line-height:1.25}
.night .pr b{font-size:15px;font-weight:700}
.night .pr i{font-style:normal;font-size:12px;color:var(--muted)}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .k{font-size:12px;font-weight:600;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700}
.tile .u{font-size:12px;color:var(--muted)}
.tr3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:12px 16px;border-bottom:1px solid var(--line2);font-size:14px}
.tr3:last-child{border-bottom:0}
.tr3.h{font-size:13px;font-weight:600;color:var(--muted)}
.backl{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-size:15px;color:var(--soft);align-self:flex-start}

/* ---------- date picker ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px}
.cal .wd{font-size:12px;font-weight:700;color:var(--soft);text-align:center;padding:4px 0}
.day{height:46px;font-size:15px;font-weight:500;position:relative;border-radius:10px;color:var(--ink);background:transparent;padding:0}
.day.in{background:#E3E1DC;border-radius:0}
.day.end{background:var(--ink);color:#FFFFFF;font-weight:700}
.day:disabled{color:#767470;cursor:not-allowed}
.day .hd{position:absolute;left:50%;bottom:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%}
.fromto{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fromto div{border-radius:12px;padding:10px 12px;background:var(--sel);color:var(--ink)}
.fromto div.act{background:var(--ink);color:#FFFFFF}
.fromto .k{font-size:12px;font-weight:600}
.fromto .v{font-size:16px;font-weight:700}

/* ---------- ideas ---------- */
.idea{padding:16px;display:flex;flex-direction:column;gap:12px}
.idea .where{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--soft)}
.idea .chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sel);color:var(--soft)}
.idea h3{font-size:18px;font-weight:700}
.idea .ch{display:flex;align-items:center;gap:10px}
.idea .ch .a{font-size:22px;font-weight:600;color:#6B6964;text-decoration:line-through}
.idea .ch .b{font-size:26px;font-weight:700}
.idea .ch .c{font-size:14px;font-weight:600;color:var(--soft)}
.idea .tx{display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.idea .tx .ex{margin:4px 0 0;padding-left:18px;font-size:14px}
.idea .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.idea .done{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 6px 6px 12px;border-radius:10px;font-size:14px;font-weight:600}
.idea .done.g{background:var(--green-bg);color:var(--green-ink)}
.idea .done.n{background:var(--sel);color:var(--soft)}
.idea .done button{min-height:44px;padding:0 8px;font-weight:700;text-decoration:underline;color:inherit}
.hist{display:flex;align-items:center;gap:12px;padding:8px 6px 8px 16px;border-bottom:1px solid var(--line2);min-height:60px;font-size:14px;line-height:1.4}
.hist:last-child{border-bottom:0}
.hist .grow{flex:1}
.hist button{min-height:44px;padding:0 8px;font-weight:700;text-decoration:underline;color:var(--ink)}

/* ---------- computer layout ---------- */
body[data-layout="desk"] .page{max-width:none;padding:20px 24px calc(32px + var(--bar-h))}
body[data-layout="desk"] .topbar{display:none}
.dhead{display:none}

      const k = r + "|" + c;

      if (!sameRaw(getRaw(r, c), open)) conflicts.push(`${rl}, ${cl}`);

    if (conflicts.length) {
      S.eng = fe; closeDialog();

async function logChange(type, detail, fields) {
  // fields: {path: {old, new}} so the history can say exactly what changed; by: who did it
  const by = auth.currentUser && auth.currentUser.email ? auth.currentUser.email : null;
  const clean = {};
  Object.entries(fields || {}).forEach(([k, f]) => { clean[k.replace(/\./g, "/")] = {old: f.old ?? null, new: f.new ?? null}; });
  try { await setDoc(doc(collection(db, "pricing_changes")), {ts: new Date(), type, detail, by, ...(Object.keys(clean).length ? {fields: clean} : {})}); } catch (e) { /* history only */ }
}
function expandDotted(fields) {
  const out = {};
  for (const [k, v] of Object.entries(fields)) { let o = out; const parts = k.split("."); parts.slice(0, -1).forEach(p => { o = o[p] ??= {}; }); o[parts[parts.length - 1]] = v; }
  return out;
}
async function writeFields(ref, fields) {
  if (!Object.keys(fields).length) return;
  try { await updateDoc(ref, fields); }
  catch (e) { if (e && (e.code === "not-found" || /no document/i.test(e.message || ""))) await setDoc(ref, expandDotted(fields), {merge: true}); else throw e; }
}
async function writeList(ref, path, freshList, rawField, adds, dels) {
  if (!adds.length && !dels.length) return;
  if (rawField && !Array.isArray(rawField) && typeof rawField === "object" && Object.keys(rawField).length) {   // an old-style map: write it once as a list
    const keep = freshList.filter(o => !dels.some(d => same(d, o)));
    await writeFields(ref, {[path]: keep.concat(adds)}); return;
  }
  if (dels.length) await writeFields(ref, {[path]: arrayRemove(...dels)});
  if (adds.length) await writeFields(ref, {[path]: arrayUnion(...adds)});
}
const sameRaw = (a, b) => (a == null && b == null) || a === b || (num(a) !== null && num(a) === num(b));

    if (Object.keys(rf).filter(k => k !== "seasonRanges").length || P.holAdd.length || holDel.length) logChange("rules_edit", "Pricing page: " + lines.join(", "), rFields);
    P.aimAdd.forEach((a, i) => { eFields[`night_aims.add.${i}`] = {old: null, new: `${a.rt} ${a.date} ${a.pct > 0 ? "+" : ""}${a.pct}%`}; });

/* ---------- ideas ---------- */
async function applyIdea(id) {
  const p = S.props.find(x => x.id === id), i = p && ideaInfo(p);
  if (!i || i.sug === null || i.cur === null) { U.ideaMsg[id] = "This idea is incomplete, so it cannot be applied."; render(); return; }
  try {
    const snap = await getDoc(rulesRef()), now = num(getPath(snap.exists() ? snap.data() : {}, i.path));
    if (now === null || Math.abs(now - i.cur) > 0.0001) {
      U.ideaMsg[id] = `This idea is out of date: the number is now ${now === null ? "not set" : i.fmt(now)}, not ${i.fmt(i.cur)}. Nothing was changed. Skip it.`;
      render(); return;
    }
    await writeFields(rulesRef(), {[i.path]: i.sug});
    await writeFields(doc(db, "pricing_proposals", id), {status: "approved", approved_at: new Date(), previous: now, applied_path: i.path, applied_value: i.sug});
    logChange("proposal_approved", `Approved: ${i.where} ${i.season} ${i.what} ${i.fmt(i.cur)} → ${i.fmt(i.sug)}`);
    p.status = "approved"; p.previous = now; p.applied_path = i.path; delete U.ideaMsg[id]; (U.ideaDone ??= {})[id] = "applied";
    await loadConfig();
  } catch (e) { U.ideaMsg[id] = "Could not apply: " + (e.message || e); }
  render();
}
async function undoIdea(id) {
  const p = S.props.find(x => x.id === id), i = p && ideaInfo(p);
  if (!i || p.previous == null) return;
  try {
    const path = p.applied_path || i.path, snap = await getDoc(rulesRef()), now = num(getPath(snap.exists() ? snap.data() : {}, path));
    if (now === null || Math.abs(now - i.sug) > 0.0001) { U.ideaMsg[id] = `The number was changed again since (now ${now === null ? "not set" : i.fmt(now)}), so I did not put the old one back.`; render(); return; }
    await writeFields(rulesRef(), {[path]: p.previous});
    await writeFields(doc(db, "pricing_proposals", id), {status: "pending", undone_at: new Date()});
    logChange("proposal_undone", `Undone: ${i.where} ${i.season} ${i.what} back to ${i.fmt(Number(p.previous))}`);
    p.status = "pending"; delete (U.ideaDone ??= {})[id]; delete U.ideaMsg[id]; U.ideaState[id] = "open";
    await loadConfig();
  } catch (e) { U.ideaMsg[id] = "Could not undo: " + (e.message || e); }
  render();
}
async function skipIdea(id, reason) {
  const p = S.props.find(x => x.id === id); if (!p) return;
  try {
    const f = {status: "rejected", rejected_at: new Date()}; if (reason) f.rejection_reason = reason;
    await writeFields(doc(db, "pricing_proposals", id), f);
    logChange("proposal_rejected", "Skipped" + (reason ? " (" + reason + ")" : ""));
    p.status = "rejected"; (U.ideaDone ??= {})[id] = "skipped"; delete U.ideaState[id];
  } catch (e) { U.ideaMsg[id] = "Could not skip: " + (e.message || e); }
  render();
}
async function againIdea(id) {
  const p = S.props.find(x => x.id === id); if (!p) return;
  try { await writeFields(doc(db, "pricing_proposals", id), {status: "pending"}); p.status = "pending"; delete (U.ideaDone ??= {})[id]; U.ideaState[id] = "open"; }
  catch (e) { U.ideaMsg[id] = "Could not show it again: " + (e.message || e); }

}

    case "ownSet": {
      if (t.getAttribute("aria-disabled") === "true") break;
      const T = U.tgt, ov = ownValues(); if (!T || !ov.ok) break; const snap = snapP(), isos = T.free.concat(T.mine).sort();
      isos.forEach(iso => {
        const rc = rec(T.rt, iso, curFor(roomById(T.rt), "GEL"));
        P.ownAdd = P.ownAdd.filter(x => !(x.rt === T.rt && x.date === iso));
        P.ownAdd.push({avail: rc ? rc.avail : null, date: iso, rt: T.rt, ...ov.values});
      });
      U.own = {GEL: "", USD: ""};
      afterNightAction(`Your price ${ownText(ov.values)} for ${nightsPhrase(isos)}.`, snap); break;
    }
    case "protectNights": {
      const T = U.tgt; if (!T || !T.free.length) break; const snap = snapP(), runs = [];
      T.free.slice().sort().forEach(iso => { const l = runs[runs.length - 1]; if (l && diffDays(l.to, iso) === 1) l.to = iso; else runs.push({from: iso, to: iso}); });
      runs.forEach(x => P.ruleAdd.push({from: x.from, to: x.to, rooms: [T.rt], action: "protect", note: "from the calendar"}));
      afterNightAction(`The engine will not change ${nightsPhrase(T.free)}.`, snap); break;
    }
    case "giveBackMany": {
      const T = U.tgt; if (!T || !T.mine.length) break;
      const keys = T.mine.map(i => `${T.rt}|${i}`);
      try {
        await setDoc(controlRef(), {release: arrayUnion(...keys)}, {merge: true});
        const cs = await getDoc(controlRef()), sp = cs.exists() ? cs.data().setprice : null;
        if (Array.isArray(sp) && sp.some(x => keys.includes(`${x.rt}|${x.date}`))) { const keep = sp.filter(x => !keys.includes(`${x.rt}|${x.date}`)); await setDoc(controlRef(), {setprice: keep}, {merge: true}); S.setprice = keep; }
        keys.forEach(k => { (U.gaveBack ??= {})[k] = true; });
        logChange("manual_released", `Gave hand-set nights back to the engine: ${roomName(T.rt)} ${datesText(T.mine)}`, Object.fromEntries(keys.map(k => [`manual/${k}`, {old: "set by you", new: "engine"}])));
        showToast("Given back. The engine takes it over at the next price update.");
      } catch (er) { message("Could not give the night back", (er && er.message) || String(er)); }
      if (U.night && !$("overlay").hidden) refreshNight(); else render();
      break;
    }
    case "moreToggle": U.more = !U.more; refreshNight(); break;
    case "selToggle": U.selMode = U.selMode === d.rt ? null : d.rt; U.picked = new Set(); render(); break;
    case "pickNight": { const pk = U.picked || (U.picked = new Set()); if (pk.has(d.iso)) pk.delete(d.iso); else pk.add(d.iso); render(); break; }
    case "delChip": {
      const c = (U._chips || [])[+d.i]; if (!c) break; const snap = snapP();
      if (c.kind === "rule") { if (P.ruleAdd.some(x => same(x, c.rule))) P.ruleAdd = P.ruleAdd.filter(x => !same(x, c.rule)); else P.ruleDel.push(c.rule); }
      else if (c.kind === "push") c.items.forEach(a => { if (isPendingPush(a)) P.pushAdd = P.pushAdd.filter(x => !same(x, a)); else P.pushDel.push(a); });
      else c.items.forEach(a => { if (isPendingAim(a)) P.aimAdd = P.aimAdd.filter(x => !same(x, a)); else P.aimDel.push(a); });
      touch(); render(); showToast(`Removed: ${c.text}.`, () => { restoreP(snap); touch(); render(); }); break;
    }
    case "delHol": {
      const o = U._holRows[+d.i].o, pend = P.holAdd.some(x => same(x, o));
      if (pend) P.holAdd = P.holAdd.filter(x => !same(x, o)); else P.holDel.push(o);
      touch(); render();
      showToast(`Removed ${fmtRange(o.from, o.to)}.`, () => { if (pend) P.holAdd.push(o); else P.holDel = P.holDel.filter(x => !same(x, o)); touch(); render(); });
      break;
    }
    case "toastUndo": if (U.undo) { const f = U.undo; U.undo = null; $("toast").hidden = true; f(); } break;
    case "eventSet":
      try { await writeFields(doc(db, "pricing_events", d.id), {status: d.v}); const ev = S.events.find(x => x.id === d.id); if (ev) ev.status = d.v; } catch (er) { message("Could not save", er.message || String(er)); }
      render(); break;
    case "dpChoice": U.dp.choice = d.id; render(); break;
    case "monthPrev": U.dp.m--; if (U.dp.m < 0) { U.dp.m = 11; U.dp.y--; } render(); break;
    case "monthNext": U.dp.m++; if (U.dp.m > 11) { U.dp.m = 0; U.dp.y++; } render(); break;
    case "pickDay": {
      const dp = U.dp, iso = d.iso;
      if (!dp.from || dp.to) { dp.from = iso; dp.to = null; } else if (iso < dp.from) dp.from = iso; else dp.to = iso;
      render(); break;
    }
    case "dpAdd": {
      if (t.getAttribute("aria-disabled") === "true") break;
      const dp = U.dp;
      if (diffDays(dp.from, dp.to) >= 365) { message("Too long", "A holiday range can be at most one year."); break; }
      P.holAdd.push({from: mdOf(dp.from), to: mdOf(dp.to), season: dp.choice});
      dp.from = dp.to = null; touch(); render(); break;
    }
    case "ideaApply": applyIdea(d.id); break;
    case "ideaAskSkip": U.ideaState[d.id] = "reasons"; render(); break;
    case "ideaBack": U.ideaState[d.id] = "open"; render(); break;
    case "ideaSkip": skipIdea(d.id, d.reason || ""); break;
    case "ideaUndo": undoIdea(d.id); break;
    case "ideaAgain": againIdea(d.id); break;
    default: break;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.inp === "hol") { holCheck(); return; }
  if (t.dataset && t.dataset.inp === "own") {
    (U.own ??= {GEL: "", USD: ""})[t.dataset.c] = t.value;
    const ok = ownValues().ok;
    document.querySelectorAll("#ownBtn").forEach(b => { b.setAttribute("aria-disabled", String(!ok)); b.className = `btn ${ok ? "dark" : "off"} full small`; });
    return;
  }
  if (t.dataset && t.dataset.inp === "season") {
    const [rt, season, cur, field] = t.dataset.k.split("|");
    setSeason(rt, season, cur, field, t.value); touch(); refreshSeasonUi();
  }
});
document.addEventListener("change", e => {                    // the slider: when the thumb is let go (taps on a label do the same through data-act)
  const t = e.target;
  if (t.dataset && t.dataset.inp === "push") applyPush(t.dataset.scope, +t.value, t.dataset.rt);
});
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeDialog(); });

/* =====================================================================
   Start
   ===================================================================== */
let started = false;
async function start() {
  if (started) return; started = true;
  $("app").hidden = false;
  $("root").innerHTML = `<div class="page"><p class="muted">Loading…</p></div>`;
  await Promise.all([loadControl(), loadConfig()]);
  applyRoute();
  await Promise.all([loadRuns(), loadEvents(), loadProposals(), loadLocks(), loadDaily(), loadBeta(), loadWeekly()]);
  render();
  window.__pricingReady = true;
}
requireOwner({auth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut}, {onReady: start});
</script>
